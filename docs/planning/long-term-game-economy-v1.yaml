# 机器可读长期计划 v1
version: "1.0"
north_star: "原版生存 × MMORPG构筑 × 玩家经济 × 文明社区 × 软赛季历史"

invariants:
  - id: C-001
    desc: "单一权威状态"
  - id: C-002
    desc: "货币仅经账本变化"
  - id: C-003
    desc: "玩家交易不铸币"
  - id: C-007
    desc: "兑换无正价值闭环"
  - id: C-012
    desc: "support_credit 物理隔离"

economy_targets:
  mature:
    active_gold_weekly_growth: "0%..1.5%"
    sink_faucet_7d: "0.90..1.05"
    conversion_gold_share: "<10%"
    equipment_create_exit_ratio: "0.90..1.20"
    market_p90_hours: "<96"
  pioneer:
    active_gold_weekly_growth: "1%..3%"
    sink_faucet_7d: "0.70..0.95"

progression:
  local_level_cap: 30
  max_ascension: 3
  post_ascension_vertical_cap: 120
  effective_level: "asc*30 + local(1..30) => 1..120"
  experience_model: "stage_budget + normalized_weight(1..29)"

currencies: [gold, merit, starlight, support_credit]
support_credit_isolation:
  forbidden_sinks:
    - gold
    - merit
    - starlight
    - equipment
    - materials
    - protection_stone
    - lucky_charm
    - experience
    - energy
    - drop_rate
    - season_attunement
    - leaderboard_power

equipment_lifecycle: [CREATED, BOUND, UNBOUND, LISTED, SOLD, SALVAGED, SACRIFICED, LEGACY_EXTRACTED, SEASON_ATTUNED, DESTROYED, QUARANTINED, RESTORED]

phases:
  - id: 0
    name: "机制目录与Kill Switch"
    branch: "codex/mechanism-registry"
    depends_on: []
  - id: 1
    name: "成长本地化"
    branch: "codex/progression-local-levels"
    audit_branch: "codex/progression-semantics-audit"
    depends_on: [0]
  - id: 2
    name: "Economy V2与物品生命周期"
    branch: "codex/economy-v2-lifecycle"
    depends_on: [1]
  - id: 3
    name: "经济仿真器"
    branch: "codex/economy-sim-v1"
    depends_on: [2]
  - id: 4
    name: "装备退出与市场V2"
    branch: "codex/equipment-exit-market-v2"
    depends_on: [2,3]
  - id: 5
    name: "support_credit分离与软赛季结算"
    branch: "codex/support-credit-season-settlement"
    depends_on: [2,3]
  - id: 6
    name: "文明社区治理"
    branch: "codex/community-governance"
    depends_on: [5]
  - id: 7
    name: "非副本终局与内容管线"
    branch: "codex/endgame-pipeline"
    depends_on: [4,6]
  - id: 8
    name: "正版UUID与多服"
    branch: "codex/uuid-velocity"
    depends_on: [5]

deliverables:
  - "docs/GAME_ECONOMY_CONSTITUTION.md"
  - "docs/LONG_TERM_GAME_ECONOMY_PLAN.md"
  - "docs/CODEX_LONG_TERM_EXECUTION_PLAN.md"
  - "docs/templates/MECHANISM_RFC_TEMPLATE.md"
  - "tools/economy-sim/README.md"
  - "tools/economy-sim/scenarios.v1.yaml"
  - "docs/audits/PROGRESSION_SEMANTICS_AUDIT.md"

codex_first_tasks:
  - order: 1
    branch: "codex/progression-semantics-audit"
    goal: "只读成长语义审计，不改运行代码"
  - order: 2
    branch: "codex/progression-local-levels"
    goal: "实现本地化成长模型，删除简化旁路"

gating:
  each_pr_requires:
    - "Goal / Non-goals / Current facts / Constitution / Migration / Failure / Rollback / Tests / Runtime / Remaining"
    - "evidence_levels: [D,S,T,M,R,H]"
  human_gates:
    - "PostgreSQL故障注入"
    - "20人以上7日真实运营"
    - "经济7日指标达标"

kill_switches:
  - "economy.faucet.*.enabled"
  - "market.escrow.enabled"
  - "season.settlement.enabled"
  - "commerce.starlight_grant.enabled"
  - "community.project.enabled"
