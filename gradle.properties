projectVersion=0.1.0-SNAPSHOT
minecraftVersion=26.2
paperApiVersion=26.2.build.100-stable
org.gradle.caching=true
# The LAN development machine also runs Paper, the website, a desktop and a
# browser. One bounded worker prevents Gradle from becoming the second OOM
# trigger while Paper is live; production CI can override these properties.
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.jvmargs=-Xmx768m -Dfile.encoding=UTF-8
