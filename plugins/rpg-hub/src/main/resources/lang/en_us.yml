npc-dialog:
  greeting: "{name} turns toward you and waits for you to speak."
  progress: "Your profile: {class} · Ascension {ascension}, Lv.{level} · Energy {energy}/{cap}"
  progress-loading: "Your profile is still loading; the role summary is available."
  open-service: "Open service"
  open-service-tooltip: "Open the authoritative gameplay service for this NPC"
  responsibility: "What do you do?"
  responsibility-tooltip: "Read this NPC's responsibility and boundaries"
  recommendation: "What should I do?"
  recommendation-tooltip: "See a practical next step for this progression line"
  leave: "End conversation"
  leave-tooltip: "Close the dialog and return to the world"
  understood: "Understood"
  ai-intro: "Xiaoqi first reads your class, stats, skill cooldowns, forged gear, Energy, journey, and current environment, then gives one executable next step. You can continue discussing builds and routes."
  ai-boundary: "The snapshot stays in server memory for this analysis. She cannot grant rewards, change currency, complete tasks, or execute admin commands."
  ai-question: "What would you like to know?"
  ai-submit: "Ask Xiaoqi"
  ai-submit-tooltip: "Submit one question; each player may have one request in flight"
  ai-chat-mode: "Conversation mode"
  ai-chat-mode-tooltip: "Use your next chat message as a question within one minute"
  ai-empty: "The question cannot be empty."
  ai-analyze: "Analyze my current state"
  ai-analyze-tooltip: "Reads the live character summary and suggests a next step without changing data"
  journey:
    current: "▶ Recommended now: {step}"
    continue: "▶ Continue: {step}"
    open-details: "See Completion Check and Steps"
    open-details-tooltip: "Open the current objective for where to go, what to press, three concrete steps, completion, and purpose"
    complete: "All eight onboarding goals are complete."
    complete-next: "Choose resource commissions, dungeons, world events, or build growth next; every entry remains on the Traveler Compass."
    open-freeplay: "▶ See What To Do Now"
    open-freeplay-tooltip: "Open the task center for commissions, dungeons, events, or community goals"
    steps:
      hub:
        name: "Meet the Hub Guide"
        goal: "Completion: have one real conversation with the central hub guide."
        where: "Where: the guide ahead of spawn; you are already speaking with them."
        why: "The Compass will point to class selection, so no entry has to be guessed."
      class:
        name: "Choose a Class"
        goal: "Completion: commit to one starting class in the Class menu."
        where: "Where: the purple class pavilion ahead-left of the plaza, or use the direct button below."
        why: "Your class defines its skill tree, weapon bonuses, and first combat loop."
      attribute:
        name: "Complete Your First Skill Build"
        goal: "Completion: allocate all 5 starting attributes, then successfully learn one class skill in the tree."
        where: "Where: allocate repeatedly in the lower Class menu, then use its bottom Skill Tree button to learn the highlighted starter."
        why: "Leave the hub with a real castable class loop; one point or a class label alone cannot fake completion."
      explore:
        name: "Complete Vanilla Exploration"
        goal: "Completion: earn any non-recipe vanilla advancement, such as Stone Age or Sweet Dreams."
        where: "Where: the green frontier guide behind the spawn platform leads to a safe location."
        why: "Vanilla exploration and gathering supply forging, commissions, and the economy."
      hunt:
        name: "Defeat an Adaptive Monster"
        goal: "Completion: defeat any one monster carrying this server's dynamic level marker."
        where: "Where: find a naturally spawned hostile with a level label in the Overworld."
        why: "The goal has no level-gap gate; only a gap under 20 grants Growth XP and mutation materials."
      forge:
        name: "Forge Personal Equipment"
        goal: "Completion: successfully forge and carry one personal item with a unique equipment ID."
        where: "Where: the orange forge pavilion ahead-right of the plaza, or use the direct button below."
        why: "Turn a vanilla base and drops into signed equipment that grows with use."
      reveal:
        name: "Confirm the First Slot Result"
        goal: "Completion: carrying a zero-slot blank confirms it immediately; slotted gear must reveal slot one in combat."
        where: "Where: inspect the item's lore first; hold or wear slotted equipment during real combat."
        why: "Zero-slot blanks can circulate, while slotted gear grows into a build through real use."
      dungeon:
        name: "Complete Your First Dungeon"
        goal: "Completion: join one valid dungeon completion reward list; party members do not need the boss's last hit."
        where: "Where: the red expedition pavilion right of spawn; check level, Energy, and party first."
        why: "Dungeons provide premium materials, hidden tickets, and special skill books."
  roles:
    guide:
      service: "Open Sivita Main Menu"
      summary: "The first stop for onboarding, the unified menu, and all help topics."
      detail: "Your class choice, exploration, first forge, hunts, slot reveals, and dungeon clears update the journey automatically; I show the next action."
      advice: "Open the handbook and follow Next Step. Choose a class first, then forge your first personal item."
    quests:
      service: "Open Tasks and Commissions"
      summary: "One view for journeys, commissions, community projects, dungeons, world events, and hidden clues."
      detail: "This view gathers journeys, commissions, dungeons, and world events, and updates after real objectives. Communities support cooperation, mentors, and public works without direct combat power."
      advice: "Prefer objectives that advance vanilla resources, item XP, and Gold together; join a fitting community without farming alt-account referrals."
    class:
      service: "Open Classes and Attributes"
      summary: "Choose a base class, allocate five attributes, and inspect ascension branches."
      detail: "Classes set efficiencies and skill gates without locking rare equipment skills. Chapter caps are 30, 60, 90, and 120."
      advice: "If unchosen, decide your preferred combat range. Otherwise build toward the attributes required by your next core skill."
    skills:
      service: "Open Skill Tree"
      summary: "Inspect the skill tree, learning gates, books, and four combat slots."
      detail: "Skills check class, level, prerequisites, attributes, and points. Left-click to equip and right-click to upgrade; hold a crafted weapon, tap F to cast and double-tap F to cycle."
      advice: "Complete one reliable damage or survival loop first. Points fund both unlocks and upgrades, while books cannot bypass the current ascension cap."
    forge:
      service: "Open Equipment Forge"
      summary: "Forge a signed item from a vanilla base and eight adaptive, boss, or salvage core materials."
      detail: "The class first forge costs 0 Gold and is guaranteed. Later forging has a 250 Gold base fee plus a vanilla base and eight materials. Quality controls stats, slots, and odds."
      advice: "Complete the first forge with your class kit. Later use renewable materials for transition gear and reserve premium bases for a settled build."
    enhancement:
      service: "Open Enhancement Workshop"
      summary: "Refine attributes, limit-break equipment, and mutate skills."
      detail: "Refining costs 400 Gold; limit breaks cost 1,200 × target stage; mutation costs 3,500 Gold and base restoration 900. Protection limits loss and luck changes odds."
      advice: "Secure useful base slots first. Do not chase final rolls on equipment you expect to replace soon."
    dungeon:
      service: "Open Dungeon Selection"
      summary: "Manage parties, Energy entry, normal bosses, and hidden depths."
      detail: "Energy and tickets are checked per member. A failed entrance or teleport returns the cost. Hidden entries use chance and pity."
      advice: "Check Energy, equipment, supplies, and party roles. Learn the normal route before spending a hidden ticket."
    wilderness:
      service: "Travel to Safe Frontier"
      summary: "Find a random safe frontier landing from the protected hub."
      detail: "Frontier travel cannot escape combat. It has no long cooldown after success, but only one search per player can run at a time. Long teleports reset overworld hunt chains."
      advice: "Bring a bed, food, and basic tools. Establish a safe base before committing to gathering or a hunt chain."
    economy:
      service: "Open Wealth and Commissions"
      summary: "Inspect Gold, Merit, Starlight, lossy exchange, commissions, and the rotating merchant."
      detail: "Gold supports daily play and trade, Merit comes from commissions, and Starlight rewards long collections. Exchange is lossy; forging, growth, taxes, and unbinding spend wealth."
      advice: "Earn Merit from commissions and Gold from vanilla play; accept a lossy exchange only for a specific shortage."
    market:
      service: "Open Player Market"
      summary: "Escrow selling, buying, cancellation, mailbox claims, and equipment unbinding."
      detail: "The market holds listed goods and charges 5% for normal items or 10% for forged equipment; enhanced gear must be unbound first."
      advice: "Blank high-slot gear can circulate freely. Check comparable listings before forging; rotating merchant buyback prices do not stay fixed."
