npc-dialog:
  greeting: "{name} 看向你，等你先开口。"
  progress: "你的档案：{class} · {ascension} 转 Lv.{level} · 体力 {energy}/{cap}"
  progress-loading: "档案仍在载入；可先阅读职责说明。"
  open-service: "办理事务"
  open-service-tooltip: "打开这个 NPC 对应的真实玩法入口"
  responsibility: "你负责什么？"
  responsibility-tooltip: "了解职责和规则边界"
  recommendation: "我现在该做什么？"
  recommendation-tooltip: "查看这条成长线的当前建议"
  leave: "结束交谈"
  leave-tooltip: "关闭对话并返回世界"
  understood: "明白了"
  ai-intro: "小栖会先读取你当前的职业、五维、技能冷却、自制装备、体力、旅程和所在环境，给出一条能立即执行的建议；也能继续讨论构筑与路线。"
  ai-boundary: "读取只发生在本服内存且只用于本次分析。她不能发奖、改货币、替你完成任务或执行管理命令。"
  ai-question: "你想了解什么？"
  ai-submit: "向小栖提问"
  ai-submit-tooltip: "提交问题；每名玩家只有一个在途请求"
  ai-chat-mode: "连续交谈"
  ai-chat-mode-tooltip: "接下来一分钟内把下一条聊天消息作为问题"
  ai-empty: "问题不能为空。"
  ai-analyze: "分析我的当前状态"
  ai-analyze-tooltip: "读取实时角色摘要并给出下一步；不会修改任何数据"
  journey:
    current: "▶ 现在推荐：{step}"
    continue: "▶ 继续：{step}"
    open-details: "查看完成判定与步骤"
    open-details-tooltip: "打开当前目标页，查看去哪、按什么、三步做法、完成判定和原因"
    complete: "八项入门目标已经完成。"
    complete-next: "现在可自由选择资源委托、副本、世界事件或构筑养成；所有入口仍在旅者罗盘中。"
    open-freeplay: "▶ 查看现在可做的事"
    open-freeplay-tooltip: "打开任务中心，选择委托、副本、世界事件或社群目标"
    steps:
      hub:
        name: "认识主城"
        goal: "完成判定：与中央引路人真实交谈一次。"
        where: "去哪里：出生平台前方的引路人；你已经在交谈。"
        why: "完成后罗盘会指向职业选择，不再需要猜入口。"
      class:
        name: "选择职业"
        goal: "完成判定：在职业菜单确定一个初始职业。"
        where: "去哪里：中央广场左前方的紫色职业亭，或点击下方直达。"
        why: "职业决定技能树、武器加成和第一套战斗循环。"
      attribute:
        name: "完成首个技能构筑"
        goal: "完成判定：先分配初始 5 点五维，再在技能树成功学习 1 个职业技能。"
        where: "去哪里：职业菜单下方连续加点，再点底部技能树学习亮起的首个技能。"
        why: "出城前先形成可实际施放的职业循环；只加 1 点或只选职业都不会伪完成。"
      explore:
        name: "完成原版探索"
        goal: "完成判定：取得任意非配方类原版进度，例如“石器时代”或“甜美的梦”。"
        where: "去哪里：出生平台后方的绿色拓荒向导会送你到安全荒野。"
        why: "原版探索与采集会产出锻造、委托和经济资源。"
      hunt:
        name: "击杀动态野怪"
        goal: "完成判定：击杀任意 1 只由本服标记等级的动态怪。"
        where: "去哪里：主世界荒野，寻找头顶带等级的自然敌对怪。"
        why: "任务不限制等级差；只有等级差小于 20 才有成长经验和异变材料。"
      forge:
        name: "锻造自制装备"
        goal: "完成判定：成功锻造并把 1 件带唯一 ID 的自制装备拿进背包。"
        where: "去哪里：中央广场右前方的橙色锻造亭，或点击下方直达。"
        why: "把原版胚材与掉落制成带你署名、可成长的装备。"
      reveal:
        name: "确认首个槽位结果"
        goal: "完成判定：0 槽白板拿进背包即确认；有槽装备需通过实战揭示第 1 槽。"
        where: "武器拿在主手、护甲穿在身上，然后前往主世界或副本战斗。"
        why: "0 槽白板可自由流通；有槽装备通过使用经历逐步形成构筑。"
      dungeon:
        name: "完成首次副本通关"
        goal: "完成判定：进入一次合法副本通关的奖励名单；组队成员不需要抢 Boss 尾刀。"
        where: "去哪里：出生平台右侧的红色远征亭；先检查等级、体力和队伍。"
        why: "副本提供高品质材料、隐藏门票与特殊技能书。"
  roles:
    guide:
      service: "打开希维塔总菜单"
      summary: "新手旅程、总菜单和所有玩法帮助的第一入口。"
      detail: "旅程会自动记录你的职业选择、原版探索、首铸、狩猎、揭槽与副本通关；这里负责告诉你下一步。"
      advice: "先打开冒险手册查看“下一步”；没选职业先去职业导师，选完后再完成第一件自制装备。"
    quests:
      service: "打开任务与委托"
      summary: "汇总旅程、日常委托、社群建设、副本目标、世界事件与隐藏线索。"
      detail: "这里汇总旅程、委托、副本与世界事件；完成真实目标后会自动更新。社群用于协作、师徒共鸣与公共建设，不直接增加战力。"
      advice: "先做能同时推进原版资源、装备经验和金币的委托；加入合适社群协作，但不要为了邀请奖励刷小号。"
    class:
      service: "打开职业与五维"
      summary: "选择基础职业、分配五维属性并查看转职分支。"
      detail: "职业决定效率与技能门槛，不锁死装备稀有技能。阶段上限为 30 / 60 / 90 / 120，晋升后进入下一转。"
      advice: "未选职业时先确定主要战斗距离；已选职业则优先满足下一项核心技能的五维要求。"
    skills:
      service: "打开技能树"
      summary: "查看技能树、学习条件、技能书与四个战斗技能槽。"
      detail: "学习会检查职业、等级、前置、五维和技能点；左键装配、右键升级；手持自制武器时单按 F 施放、双按 F 切换。"
      advice: "先补足一个稳定输出或生存循环；技能点同时用于解锁与升级，技能书不能绕过当前转阶上限。"
    forge:
      service: "打开装备锻造"
      summary: "把原版胚材与 8 份动态怪、Boss 或分解核心材料锻成署名装备。"
      detail: "职业首铸为 0 金币、100% 成功；后续普通锻造基础费 250 金币，另需原版胚材和 8 份材料。品质影响属性预算、槽位上限和成功率。"
      advice: "先用职业礼包完成首铸；之后用能稳定取得的材料做过渡装，高品质胚材和催化剂留给已经确定方向的主武器。"
    enhancement:
      service: "打开强化工坊"
      summary: "负责属性精炼、装备突破和技能变异。"
      detail: "精炼 400 金币；突破为 1200×目标阶段；技能变异 3500 金币，恢复原式 900 金币。保护石只保护失败损失，幸运符只改变概率。"
      advice: "先保证装备有可用的基础槽，再投入高价精炼；不要在即将被替换的过渡装备上追求毕业数值。"
    dungeon:
      service: "打开副本选择"
      summary: "管理队伍、副本体力、普通 Boss 与隐藏层入口。"
      detail: "每名队员单独结算体力与门票；建图、排队或传送失败会整体退款。隐藏关同时有概率与保底路径。"
      advice: "入场前检查体力、装备、补给和队伍职责；第一次先打普通路线，熟悉机制后再消耗隐藏门票。"
    wilderness:
      service: "前往安全荒野"
      summary: "从主城寻找随机安全荒野落脚点。"
      detail: "传送不能用于脱战；成功后没有长期冷却，但同一时间只会处理一次定位。远距离传送会清空原版世界的连续猎杀层数。"
      advice: "出发前带床、食物和基础工具；抵达后先建立安全据点，再决定采集还是连猎。"
    economy:
      service: "打开财富与委托"
      summary: "查看金币、功勋、星辉、有损兑换、委托与轮换商人。"
      detail: "金币用于日常与交易，功勋来自委托，星辉来自长期收藏；兑换有损，锻造、培养、税费与解绑都会消耗财富。"
      advice: "优先用委托补功勋、用原版行为补金币；只有明确缺少目标物时再承受有损兑换。"
    market:
      service: "打开玩家市场"
      summary: "托管出售、购买、取消、邮件领取和装备解绑规则。"
      detail: "上架后物品由市场保管，普通物品收 5%，自制装备收 10%；强化装备必须先解绑。"
      advice: "白板高槽装备可以直接流通；锻造前先看同类成交价，轮换商人的回收价不会长期固定。"
