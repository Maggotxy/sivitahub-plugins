messages:
  zh_cn:
    menu-title: '同行灵契'
    help:
      - '【同行灵契】在主世界捕获：野生目标先压到 15% 生命以下。'
      - '手持拴绳攻击约有 25% 成功率；原版可驯服生物需要先完成驯服。'
      - '捕获后在 /companion 中选择御守、猎锋、灵愈或远巡路线。'
      - '宠物跟随战斗获得经验，当前最高 30 级；同一时间只出战一只。'
      - '投喂、共同战斗和等级里程碑会增加亲密度；10级/250亲密、20级/750亲密可完成两次形态突破。'
      - '图鉴永久记录捕获过的物种；突破解锁共鸣、升华外观，可在外观收藏中随时切换。'
      - '性格：勇毅缩短冷却、沉静加快能量、好奇降低消耗、忠诚加快亲密；特质会强化对应能力。'
      - '捕获后会获得灵契号角。手持号角右键释放路线专属技能，不占用键位，也不需要专用客户端。'
      - '喂食宠物偏好的原版食物恢复饱食；右键宠物可查看原生交互。'
      - '主城、副本、PvP 和战斗中召回受限；宠物不会拾取或生产物资。'
      - '宠物只攻击敌对生物并最多压到 1 点生命；由玩家完成最后一击才会掉落。'
      - '左键菜单按钮执行，行为按钮左键友善、右键主动。'
      - '改名：/companion name <新名字>（最多 16 个字符）。'
