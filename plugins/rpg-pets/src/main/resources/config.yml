  en_us:
    menu-title: 'Companion Bond'
    help:
      - '【Companions】In the overworld, lower a wild capturable creature below 15% health.'
      - 'Hit with a lead for about 25% capture chance; vanilla tameables must be tamed first.'
      - 'Choose Guardian, Hunter, Healer or Ranger in /companion after capture.'
      - 'Pets gain combat XP up to level 30. Only one pet may be active.'
      - 'Feeding, fighting together, and level milestones build Bond. Evolve at level 10 / 250 Bond and level 20 / 750 Bond.'
      - 'The permanent Codex tracks captured species; evolutions unlock Resonant and Ascendant appearances.'
      - 'Brave shortens cooldowns, Calm restores energy, Curious lowers cost, and Loyal builds Bond faster; traits tune abilities.'
      - 'Capture grants a Bond Horn. Hold it and right-click for a route ability; no custom client or keybind is required.'
      - 'Feed its preferred vanilla food to restore hunger; right-click it for native interaction.'
      - 'Pets cannot gather resources, fight players, enter dungeons, or be called in combat.'
      - 'Pets only suppress hostile mobs to 1 HP; the player must land the final hit for drops.'
      - 'Left-click menu actions; left/right-click Behavior for friendly/aggressive.'
      - 'Rename with /companion name <new name> (16 characters maximum).'
