name: RpgPets
version: '${version}'
main: cn.originalrpg.pets.RpgPetsPlugin
api-version: '${paperApi}'
authors: [OriginalRpg]
description: MyPet-backed capture, codex, bond, evolution, appearances and safe RPG companion combat.
depend: [RpgApi, RpgCore, RpgCombat, MyPet]
commands:
  companion:
    aliases: [petmenu, buddy]
    description: Open and manage the RPG companion system.
    usage: /companion [help|status|call|off|capture|skill|inventory|storage|behavior|name|revive|codex|skins|evolve|signal]
    permission: rpg.pets.use
permissions:
  rpg.pets.use:
    default: true
  rpg.pets.admin:
    default: op
