name: RpgWorld
version: '${version}'
main: cn.originalrpg.world.RpgWorldPlugin
api-version: '${paperApi}'
authors: [OriginalRpg]
description: Overworld events and consecutive hunt chains.
depend: [RpgApi, RpgCore, RpgMobs]
softdepend: [RpgPerformance]
commands:
  worldstatus:
    aliases: [eventstatus, huntstatus]
    description: Show blood-moon timing and the current overworld hunt chain.
    usage: /worldstatus
    permission: rpg.world.status
  journal:
    aliases: [fieldjournal]
    description: Open permanent exploration, nature and crafting collection goals.
    usage: /journal [help|status|<entry-id> [page]]
    permission: rpg.world.journal
permissions:
  rpg.world.status:
    default: true
  rpg.world.journal:
    default: true
