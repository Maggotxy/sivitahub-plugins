# This is a price ceiling, not a cheap source of vanilla commodities. Public
# prices deliberately sit above the expected player-market range; membership
# only removes 5%, so gathering and player trade remain the best-value path.
# Purchases burn Gold and use database-backed daily quotas across all shards.
# Delivered stacks are completely ordinary and are never account-bound.
# The five IDs/materials, maximum stack, maximum daily throughput, price floor,
# and 5% maximum member discount are also enforced by SupplyCatalogPolicy.
# A new commodity must be reviewed in code; adding only YAML fails closed.
