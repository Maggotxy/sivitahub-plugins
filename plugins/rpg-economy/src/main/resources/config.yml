# Vanilla activity feeds the same forge/equipment loop instead of minting an
# uncapped second economy. Essence is account-bound and capped in player PDC;
# commodities still leave the world through commissions or the taxed market.
vanilla-integration:
  essence:
    daily-cap: 12
    raid-amount: 2
    chance:
      mining: 0.055
      farming: 0.012
      fishing: 0.080
  equipment-xp:
    log: 2
    crop: 2
    ore: 3
    fishing: 3
    advancement: 25
    raid: 120
earned-shop:
  # One account-wide recovery route for a lost first forge. It consumes Gold,
  # uses a durable database lifetime quota, and yields bound cores that cannot
  # enter player trade or an automated currency loop.
  first-forge-rescue:
    name: "First-Forge Recovery Cores"
    material: ECHO_SHARD
    amount: 8
    marker: forge_essence
    gold: "300.00"
    merit: 0
    lifetime-limit: 1
    period-key: "starter-v1"
  protection-stone:
    name: "Enhancement Protection Stone"
    material: AMETHYST_SHARD
    amount: 1
    marker: protection_stone
    gold: "4500.00"
    merit: 30
  lucky-charm:
    name: "Advanced Lucky Charm"
    material: ECHO_SHARD
    amount: 1
    marker: lucky_charm
    gold: "2200.00"
    merit: 12

black-market:
  refresh-days: 14
  timezone: "Asia/Shanghai"
  # Only a deterministic subset is visible each period. Every Paper shard derives the same rotation.
  visible-offers: 3
  # Even the cheapest purchase in one period must lose at least this fraction against
  # the highest possible buyback in another period. This closes stockpiling arbitrage.
  # G-208：0.10 是对玩家的承诺值，不是默认值。低于 0.10 的配置会让插件拒绝启动
  # （MerchantPricing.requiredMinimumRoundtripLoss），不要再把它当成可调下限。
  minimum-roundtrip-loss: 0.10
  offers:
    mutation-shards:
      material: AMETHYST_SHARD
      amount: 8
      marker: adaptive
      marker-value: mutation-shard
      model: mutation_shard
      base-price: "900.00"
      sell-multiplier-minimum: "0.80"
      sell-multiplier-maximum: "1.80"
      buyback-ratio: 0.55
      purchase-limit: 4
      buyback-limit: 2
    ruins-cores:
      material: AMETHYST_SHARD
      amount: 8
      marker: boss
      marker-value: ancient-ruins
      model: dungeon_core
      base-price: "1800.00"
      sell-multiplier-minimum: "0.90"
      sell-multiplier-maximum: "2.00"
      buyback-ratio: 0.52
      purchase-limit: 2
      buyback-limit: 1
    protection-stone:
      material: AMETHYST_SHARD
      amount: 1
      marker: reward
      marker-value: protection_stone
      model: protection_stone
      base-price: "5200.00"
      sell-multiplier-minimum: "0.85"
      sell-multiplier-maximum: "1.65"
      buyback-ratio: 0.50
      purchase-limit: 2
      buyback-limit: 1
    lucky-charm:
      material: ECHO_SHARD
      amount: 1
      marker: reward
      marker-value: lucky_charm
      model: lucky_charm
      base-price: "2700.00"
      sell-multiplier-minimum: "0.85"
      sell-multiplier-maximum: "1.65"
      buyback-ratio: 0.50
      purchase-limit: 3
      buyback-limit: 1
