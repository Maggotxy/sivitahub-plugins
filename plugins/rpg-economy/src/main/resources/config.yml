caps:
  HUNTING: {gold: "2500.00", merit: 18}
  DUNGEON: {gold: "5000.00", merit: 55}
  GATHERING: {gold: "1800.00", merit: 12}
  EXPLORATION: {gold: "100000.00", merit: 500}
  # Raids are renewable and can be automated, so they must not share the
  # intentionally large one-time advancement pool. Three full victories reach
  # this independent database-backed daily ceiling.
  # G-207：显式的每日场次上限，与金币/功勋额度并行生效。
  # 0 表示不限制。「每日三场」曾经只是 1800/600 与 24/8 的除法结果，
  # 现在由 maximum-events-per-day 直接承担，改额度不会再悄悄改变场次上限。
  RAID: {gold: "1800.00", merit: 24, maximum-events-per-day: 3}
  GUIDE: {gold: "1000.00", merit: 20}
# Ordinary kills retain a unique idempotency key, but up to 64 of them share
# one account lock and database transaction. Work is spread across ticks so a
# mob farm cannot submit hundreds of JDBC jobs at once.
hunting-write-buffer:
  flush-ticks: 20
  max-batch-size: 64
  max-player-flushes-per-tick: 6
  max-pending-per-player: 512
  shutdown-timeout-ms: 5000
rewards:
  hunting:
    base-gold: "6.00"
    gold-per-level: "0.55"
    elite-multiplier: 4.0
    blood-moon-multiplier: 1.5
    elite-merit: 1
    blood-moon-merit: 1
  advancement:
    gold: "120.00"
    merit: 1
  vanilla:
    fishing: {gold: "14.00", merit: 0}
    raid: {gold: "600.00", merit: 8}
  dungeons:
    ancient-ruins: {gold: "650.00", merit: 8}
    ancient-ruins-hidden: {gold: "2200.00", merit: 28}
    sulfur-depths: {gold: "900.00", merit: 12}
    sulfur-depths-hidden: {gold: "2500.00", merit: 32}
    storm-vault: {gold: "1400.00", merit: 18}
    storm-vault-hidden: {gold: "3200.00", merit: 40}

# Renewable vanilla items are resource sinks, never sufficient proof for minting
# Gold by themselves. Each submission also consumes account-bound evidence from
# a natural XP ore, a non-recipe advancement, a real fishing catch, or a raid.
# Evidence is not an item/currency, resets daily, and cannot be traded.
commissions-policy:
  timezone: "Asia/Shanghai"
  visible-per-day: 3
  total-daily-limit: 3
  # Stops disposable fresh accounts from turning shared farm stock into Gold.
  minimum-play-minutes: 60
  default-offer-daily-limit: 1
  default-evidence-cost: 1
  maximum-gold-per-evidence: "250.00"
  # A future config edit cannot turn a renewable-material commission into an
  # unbounded source of the account-bound progression currency either.
  maximum-merit-per-evidence: 2
  active-evidence:
    daily-cap: 4
    sources:
      natural-mining: {grant: 1, daily-cap: 3}
      advancement: {grant: 1, daily-cap: 2}
      fishing: {grant: 1, daily-cap: 1}
      raid: {grant: 2, daily-cap: 2}
commissions:
  mason:
