completion-return-delay-seconds: 8
# Boss rewards are written as one atomic all-party intent on a dedicated
# single writer before any database settlement or dungeon-complete side effect.
reward-journal:
  queue-capacity: 96
  shutdown-drain-millis: 3000
session-timeout-minutes: 30
season-expedition:
  enabled: true
  # Rotation boundaries are Monday 00:00 in this zone. A run crossing the
  # boundary remains a normal dungeon clear but cannot settle the old week.
  timezone: Asia/Shanghai
  rotation-epoch-monday: '2026-08-03'
  # 0 keeps the launch season slice testable. Raising this to 1/2/3 gates it
  # behind the matching database-authoritative chapter sequence.
  minimum-chapter-sequence: 0
party:
  maximum-size: 4
  invitation-seconds: 60
  ready-distance: 24.0
  boss-health-per-extra-player: 0.65
  boss-damage-per-extra-player: 0.12
  wave-health-per-extra-player: 0.35
  wave-damage-per-extra-player: 0.08
instance-pool:
  # Disposable flat worlds are prepared before players need them. Arena blocks
  # are written over several ticks, then the world is recycled after a run.
  # One complete arena per type gives every route an immediate first entry
  # without keeping a second idle copy of all six routes in memory. Additional
  # instances are built under the TPS guard when a route is already occupied.
  warm-per-dungeon: 1
  # Six warm worlds plus up to ten active/queued builds remains inside the
  # single-node memory budget while still allowing real party concurrency.
  maximum-worlds: 16
  maximum-queued-entries: 64
  queue-timeout-seconds: 45
  blocks-per-tick: 384
  # The arena is only 64x64. A dedicated 4/3 profile avoids retaining or
  # sending the global 7/4 radius for empty flat chunks.
  view-distance: 4
  simulation-distance: 3
  # Pause non-critical world preparation while the main thread is pressured.
  build-minimum-tps: 18.5
visual-effects:
  enabled: true
  receiver-radius: 64.0
  boss-warning-delay-ticks: 30
  sound-volume: 0.80
  particles:
    normal: 24
    pressure: 10
    critical: 3
