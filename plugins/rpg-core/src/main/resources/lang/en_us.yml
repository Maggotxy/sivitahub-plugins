  help:
    invalid: "Help topic not found. Use /rpghelp for your current objective, or /rpghelp home for the help home."
    start:
      title: "Getting Started"
      summary: "An eight-step journey driven by real progress that presents only your most useful current action."
      preparation: "No stored items are required. Read the current objective, travel to its destination, and completion records automatically."
      where: "Meet the Guide ahead of the hub spawn platform, or right-click the Traveler Compass in hotbar slot 9."
      npc: "Guide / Traveler Compass / Onboarding Journey"
      npc-short: "Current Objective"
      primary: "Continue Current Objective"
      primary-tooltip: "Open the eight-step journey with one highlighted objective, destination, and unlock"
      secondary: "View Tour and Story"
      secondary-tooltip: "Open prologue-tour status; the optional three-minute tour never replaces the eight-step progression"
      lines:
        - "Choose a class and allocate core attributes first."
        - "Open /skills to learn and left-click to equip. Hold a crafted weapon, tap F to cast and double-tap F to cycle."
        - "Your class kit contains a first-forge base and eight cores; use /forge for a free, guaranteed first item."
        - "Use /wild from the hub, place a bed, and use /sethome beside it; /home works only in the Overworld."
        - "Explore vanilla content and hunt overworld monsters for later forge materials, Gold, and Merit."
        - "Equipment gains experience through use and reveals its slots over time."
        - "Use /visuals to tune particles and gameplay sounds without changing any stats."
    tasks:
      title: "Tasks, Commissions, and Events"
      summary: "One entry combines one-time onboarding, daily resource commissions, dungeons, world events, and weekly community goals while each real system remains authoritative."
      preparation: "Read the live status first. Commissions need 60 minutes played, active-labor evidence, and materials; dungeons need level, personal Energy, party eligibility, and sometimes a ticket."
      where: "Right-click Commission Officer Shijian in the hub, or use /tasks. The center routes onward to commissions, dungeons, World Status, or your current journey objective."
      npc: "Commission Officer / Tasks and Commissions / authoritative gameplay entries"
      npc-short: "Commission Officer"
      primary: "Open Tasks and Commissions"
      primary-tooltip: "View the current onboarding goal, today's commissions, dungeons, world events, vanilla resonance, communities, and task mailbox"
      secondary: "View Today's Resource Commissions"
      secondary-tooltip: "Read today's rotation, materials, active-labor evidence, personal limits, and real reward quota"
      lines:
        - "The eight-step onboarding route completes once; it shows one next action, its completion check, and its direct entry."
        - "Three resource commissions rotate daily, each once and at most three per account; items are really removed and bound active-labor evidence is required, so farm stock alone cannot mint Gold."
        - "Dungeon entry validates each player's level, Energy, party, and ticket; only a successful clear with the player in the reward roster completes it."
        - "Blood moons, hunt chains, and vanilla resonance need no fictional accept button; real kills, gathering, fishing, advancements, and raids advance their owning systems directly."
        - "The prologue tour introduces the hub but never replaces onboarding; weekly community projects are multiplayer Gold sinks and never mint Gold directly."
        - "Confirmation rechecks requirements, costs, rewards, and limits; closing a menu never loses progress."
    profile:
      title: "Character Progression"
      summary: "Character levels, ascensions, attributes, skill points, and dungeon Energy independent from vanilla XP orbs."
      preparation: "No item is required. Most Growth XP comes from similarly leveled adaptive monsters and dungeon bosses."
      where: "Open the profile anywhere; use the Adaptive Monster Guide separately for an appropriate leveling route."
      npc: "Guide / Character Profile / Adaptive Monster Guide"
      npc-short: "Guide"
      primary: "Open Character Profile"
      primary-tooltip: "View live level, XP, core attributes, Energy, and current class values"
      secondary: "View Leveling Route"
      secondary-tooltip: "Show eligible monster levels, real kill XP, and your next dungeon from effective level"
      lines:
        - "The initial cap is level 30; later ascensions open by server chapter."
        - "Levels grant attribute points, and every third level grants a skill point."
        - "Energy enters dungeons, while stamina raises the energy cap."
        - "Adaptive monsters and dungeon bosses grant character Growth XP; vanilla XP orbs still serve enchanting and Mending."
        - "Use /rpg or hold TAB for current/next-level XP; /mobguide shows where your level should hunt and which dungeon is next."
    classes:
      title: "Classes and Attributes"
      summary: "Six starting classes define skill trees and weapon affinities; five core attributes determine skill eligibility and builds."
      preparation: "A first class choice is not freely reversible. Read a skill requirement, then repeatedly allocate available points toward it."
      where: "Meet the Class Mentor in the purple hub pavilion, or open the Class menu from any operable location."
      npc: "Class Mentor / Class and Attributes / Skill Tree"
      npc-short: "Class Mentor"
      primary: "Choose Class and Allocate"
      primary-tooltip: "Open the class, attributes, and ascension menu with refresh-in-place repeated allocation"
      secondary: "Inspect Skill Tree"
      secondary-tooltip: "Check current-class skills and each attribute, level, and skill-point requirement"
      lines:
        - "Starting classes: Healer, Warrior, Assassin, Mage, Ranger, and Freeform."
        - "Defense, Strength, Agility, Intelligence, and Stamina shape every build."
        - "Five-point starters: Healer 3 Int/2 Sta; Warrior 3 Str/2 Sta; Assassin 4 Agi/1 Sta; Mage 4 Int/1 Sta; Ranger 3 Agi/2 Str; Freeform 1 each. Every class can learn its first skill immediately."
        - "Class weapons gain efficiency, while rare equipment skills enable cross-class builds."
    equipment:
      title: "Forging and Equipment"
      summary: "Combine a vanilla base, RPG drops, and an optional catalyst into growing personal equipment signed by its crafter."
      preparation: "Hold an eligible vanilla equipment base and carry at least eight core materials, Gold, and an optional imprint."
      where: "Meet the Forgemaster in the orange hub pavilion; after forging, use the item in real combat to gain equipment XP."
      npc: "Forgemaster / Forge / Enhancement Artisan"
      npc-short: "Forgemaster"
      primary: "Open the Forge"
      primary-tooltip: "Open the real forge and inspect base, materials, Gold, odds, and output slot by slot"
      secondary: "View Later Progression"
      secondary-tooltip: "Open refinement, limit break, legacy, unbinding, and salvage entries"
      lines:
        - "The class first forge uses its kit base and eight cores for 0 Gold at 100% success; later forging needs a vanilla base, eight materials, and a 250 Gold base fee."
        - "Vanilla base quality and rolled rarity jointly control success, slot ceilings, and growth room."
        - "Vanilla enchants, anvil renaming, trims, and diamond-to-netherite upgrades remain; forged gear is indestructible, and grindstones reject gameplay items."
        - "Equipment binds on first combat use and permanently records its crafter."
        - "An item with attribute slots has a 1.5% rare-trait roll when inheritance does not succeed; the current ten are equally weighted at about 0.15% each and remain hidden/inactive until fully revealed."
        - "Use /unbind to pay a dynamic Gold sink before bound or enhanced equipment can enter escrow."
        - "Use /salvage to permanently convert spare forged equipment into bound essence."
        - "A bound rare-trait item with every slot revealed and limit break 2+ can be sacrificed with /legacy; its blueprint never copies stats."
    sulfur:
      title: "26.2 Sulfur Resonance Imprints"
      summary: "Use 26.2 sulfur cubes and vanilla materials to make directed imprints that bias refinement without guaranteeing it."
      preparation: "Craft a blank imprint, then prepare shears and one supported vanilla block; the finished item is account-bound."
      where: "Feed and shear a sulfur cube in the Overworld, then put the imprint in forge slot 22 at the orange hub pavilion."
      npc: "Forgemaster / Imprint Status / Forge"
      npc-short: "Forgemaster"
      primary: "View Imprint Status"
      primary-tooltip: "Show today's extraction quota, cooldown, material biases, and complete 26.2 interaction instructions"
      secondary: "Forge with an Imprint"
      secondary-tooltip: "Open the forge; slot 22 accepts only a valid signed imprint owned by you"
      lines:
        - "Craft a blank imprint from one paper, two sulfur, and one cinnabar."
        - "Feed a supported vanilla block to a sulfur cube; shear it with shears in one hand and a blank imprint in the other."
        - "Wood biases Agility, minerals Defense, metals Strength, wool Intelligence, honey Healing, ice and sulfur Skill Haste, and cinnabar Critical."
        - "Put the imprint in forge slot 22. It changes the target stat's refinement weight, not enhancement success, and never guarantees a stat."
        - "A normal imprint gives the target about 26.3%; potent resonance gives about 31.7%; without one every stat is 12.5%."
        - "Finished imprints are account-bound. Extract up to six daily, with a five-minute cooldown per cube. Use /imprint for status."
    mobs:
      title: "Adaptive Monsters"
      summary: "Natural Overworld hostiles adapt around nearby player levels and provide Growth XP, equipment materials, and elite challenges."
      preparation: "Choose a class and allocate attributes first. Bring food, a bed, and suitable equipment; avoid targets with a 20-level gap."
      where: "Return safely to the hub, then use the green Frontier Guide or /wild to reach the unprotected Overworld frontier."
      npc: "Frontier Guide / Adaptive Monster Guide / World Status"
      npc-short: "Frontier Guide"
      primary: "View Eligible Mobs and XP"
      primary-tooltip: "Read your level and show adaptive range, real kill XP, and the next dungeon"
      secondary: "View Blood Moon and Chain"
      secondary-tooltip: "Show live blood-moon timing, hunt target, stacks, and reset conditions"
      lines:
        - "There are no fixed level zones: use /wild for the Overworld frontier, where natural hostiles spawn from the nearest player's effective level -3 through +6."
        - "Eligible adaptive kills grant character Growth XP; elites grant substantially more. Use /mobguide for your live range."
        - "A gap of 20 levels or more grants no Growth XP or RPG materials, only vanilla drops."
        - "Elites and blood-moon monsters have better material rates, subject to daily economy caps."
        - "Use /mobguide for current XP, XP remaining, recommended dungeons, and configured boss XP."
    dungeons:
      title: "Dungeons"
      summary: "Energy-priced 1–4 player instances with guardian waves, normal bosses, and pity-backed hidden entries."
      preparation: "Everyone must be online, in the leader's world within 24 blocks, and individually meet level, Energy, and ticket rules."
      where: "Meet the Expedition Officer in the red hub pavilion and inspect every entry's live requirements first."
      npc: "Expedition Officer / Dungeon Selection / Party Status"
      npc-short: "Expedition Officer"
      primary: "Choose an Eligible Dungeon"
      primary-tooltip: "Open real entries showing level, Energy, party, and hidden-ticket requirements before selection"
      secondary: "View Party Status"
      secondary-tooltip: "Check leader, members, and current party state without spending Energy"
      lines:
        - "Dungeons use shared instances for parties of 1-4; the leader starts group entry."
        - "Every member must be online, in the leader's world within 24 blocks, and meet level, energy, and ticket rules."
        - "Energy and tickets are checked per member; if the entrance or teleport fails, spent Energy is returned."
        - "Complete configured guardian waves before the boss; rewards settle separately for online instance members."
        - "Normal bosses can drop hidden-room tickets and have a pity counter."
        - "Hidden bosses offer higher-quality materials and special skill books."
        - "Party commands: /dungeon party create|invite|accept|leave|kick|disband|info."
    enhancement:
      title: "Enhancement and Mutation"
      summary: "Random refinement, equipment limit breaks, and skill mutation built around revealed slots, with Gold and materials as long-term sinks."
      preparation: "Bring eligible forged equipment, revealed slots, Gold, and required materials; confirm the risk in the preview first."
      where: "Meet the Enhancement Artisan in the cyan hub pavilion; protection stones and charms have Merit and Starlight paths."
      npc: "Enhancement Artisan / Equipment Progression / Merit Shop"
      npc-short: "Enhancement Artisan"
      primary: "Open Equipment Progression"
      primary-tooltip: "Enter the owned routes for refinement, limit break, mutation, salvage, legacy, and unbinding"
      secondary: "View Merit Protection Items"
      secondary-tooltip: "Open the real Merit shop and inspect balance, price, and limits for protection items"
      lines:
        - "Refinement costs 400 Gold and randomly overwrites one revealed slot, including possible negative rolls."
        - "Limit breaks cost 1,200 × target stage; stones prevent failure penalties and charms improve odds when safe/lucky is specified."
        - "Skill mutation costs 3,500 Gold; restoring the base form costs 900 Gold."
        - "A stone costs 4,500 Gold + 30 Merit or 60 Starlight; a charm costs 2,200 Gold + 12 Merit or 30 Starlight."
    skills:
      title: "Skill Tree"
      summary: "Class skills, equipment borrowing, and matching-rune mastery share one active system for mana, cooldowns, and combat scaling."
      preparation: "Choose a class and learn its skills. To borrow, fully reveal and personally bind signed equipment carrying a skill rune."
      where: "Meet the Skill Mentor in the blue hub pavilion or open the tree anywhere operable; hold TAB for a cooldown summary."
      npc: "Skill Mentor / Skill Tree / Class and Attributes"
      npc-short: "Skill Mentor"
      primary: "Open Skill Tree"
      primary-tooltip: "Learn repeatedly without closing; learned green skills can be cast directly"
      secondary: "Adjust Class and Attributes"
      secondary-tooltip: "Return to the class menu and repeatedly allocate toward the real target-skill requirements"
      lines:
        - "Learning requires the correct class, attributes, and skill points."
        - "Six equipment runes grant Heal, War Cry, Shadow Step, Fireball, Power Shot, or Improvisation; active cross-class skills appear directly in /skills."
        - "A rune activates only after every item slot is revealed and the item is bound to you; unequipping, unbinding, or an invalid signature removes access immediately."
        - "Borrowing has about 65% power or duration, 1.5x mana and cooldown, then 3s Weakness plus Glowing; borrowed War Cry is personal."
        - "A learned matching skill becomes mastered: at most 115% output or duration and 0.85x base cooldown; duplicate runes never stack."
        - "Fireballs and arrows freeze borrowed power at launch, then still receive 0.50 player and 0.75 Boss scaling; gear swaps cannot bypass it."
        - "Hidden skill books come from special bosses, events, and reproducible secrets."
    market:
      title: "Market and Binding"
      summary: "Durable escrow and mail deliver high-value player trades while transaction tax permanently removes transferred Gold."
      preparation: "Bring Gold to buy. To sell, hold the item; the server validates binding, account binding, quantity, and price."
      where: "Meet the Market Broker in the green hub pavilion; trades, cancellations, and system goods share durable mail."
      npc: "Market Broker / Escrow Market / Durable Mailbox"
      npc-short: "Market Broker"
      primary: "Open Escrow Market"
      primary-tooltip: "Browse real listings and buy through a native confirmation; fees and delivery settle in one transaction"
      secondary: "Claim Mailbox Items"
      secondary-tooltip: "Claim trades, cancellations, and system products, including deliveries surviving disconnects"
      lines:
        - "High-value items use escrow, and transaction tax permanently removes gold."
        - "Elite materials, blood-moon items, dungeon cores, tickets, and skill books cannot be transferred privately."
        - "Unmodified blank equipment can be listed; bound items cannot."
        - "Ordinary vanilla commodities can list as full stacks; forged equipment remains one item per escrow listing."
        - "Trades and system products use a durable mailbox and survive disconnects."
    economy:
      title: "Wealth System"
      summary: "Gold circulates between players while Merit and Starlight bind to accounts; lossy, capped exchange makes one earnable wealth system."
      preparation: "Check balances and periodic quotas first; resource commissions also require active-labor proof, playtime, and personal limits."
      where: "Meet the Wealth Steward in the gold hub pavilion, or use the unified menu for wealth, commissions, shops, and market."
      npc: "Wealth Steward / Wealth Center / Resource Commissions"
      npc-short: "Wealth Steward"
      primary: "Open Wealth Center"
      primary-tooltip: "View balances, commissions, Merit shop, lossy exchange, vanilla resonance, and rotating merchant"
      secondary: "View Today's Commissions"
      secondary-tooltip: "Read today's rotation, active-labor requirements, completion progress, and personal quota"
      lines:
        - "Gold is tradable; Merit and Starlight are account-bound."
        - "All three can be exchanged through lossy fixed recipes with daily and weekly limits."
        - "Starlight can be earned in-game or granted by administrators with unique audited references."
        - "Every numerical product has an in-game path, and its source never changes the final ceiling."
        - "Gathering, fishing, advancements, and raids feed forging, equipment XP, commissions, and the player market."
        - "Automatic-farm goods remain useful for building and player trade, but the system never buys them at an unrestricted fixed price; stock alone cannot mint Gold."
        - "Resource commissions also require untradeable active-labor evidence, 60 minutes of play, daily rotation, and personal limits."
        - "Supply goods are costly, limited price ceilings that only burn Gold; the player market only transfers Gold and charges tax."
    world:
      title: "Blood Moons and Hunt Chains"
      summary: "Vanilla time, natural spawning, and consecutive hunts form an Overworld loop that remains useful while dungeon Energy recovers."
      preparation: "Kill eligible natural hostiles outside Overworld protection; commit to one target and avoid other kills or distant relocation."
      where: "Use the hub Frontier Guide. Blood moons affect only natural Overworld hostiles, and dungeons never count toward hunt chains."
      npc: "Frontier Guide / World Status / Adaptive Monster Guide"
      npc-short: "Frontier Guide"
      primary: "View Live World Status"
      primary-tooltip: "Show blood-moon timing, hunt target, stacks, bonus, remaining time, and reset reasons"
      secondary: "View Eligible Hunting"
      secondary-tooltip: "Confirm effective level, adaptive range, Growth XP, and recommended dungeon"
      lines:
        - "A blood moon occurs every seven complete vanilla nights and empowers naturally spawned Overworld hostiles only."
        - "Repeated eligible kills of the exact same mob build special-material odds: 0% on the first, then +0.2% per stack up to +8%."
        - "A different creature, a gap over 300 seconds, a world change, or moving/teleporting over 128 blocks resets the chain."
        - "Use /worldstatus for nights until the next blood moon and your current target, stacks, bonus, and remaining time."
    store:
      title: "Starlight and Membership"
      summary: "A high-threshold account-bound route in the unified economy for same-ceiling protection items and permanent cosmetics, never paid-only power."
      preparation: "Check Starlight, item limits, and earnable sources first; membership is timed convenience and never replaces progression."
      where: "Enter the Starlight store through the unified menu or Wealth Steward; administrator grants require unique audited references."
      npc: "Wealth Steward / Starlight Store / Cosmetic Settings"
      npc-short: "Wealth Steward"
      primary: "Open Starlight Store"
      primary-tooltip: "View live Starlight, progression protection items, membership, and permanent cosmetic unlocks"
      secondary: "View Wealth Exchange"
      secondary-tooltip: "Learn Starlight's earnable sources, lossy exchange, and periodic quotas"
      lines:
        - "Starlight is an account-bound part of the wealth system, not a paid-only power ceiling."
        - "Administrator grants require unique references and every adjustment is audited."
        - "Starlight products match earnable products and share the same final progression ceiling."
        - "Exchange loss and periodic limits prevent circular arbitrage."
        - "Prismatic Resonance is cosmetic-only and is available through costly earned Starlight or cumulative support."
        - "Resonance Wings and Starfall Comet are permanent cosmetics purchasable with earned Starlight."
    community:
      title: "Communities and Mentors"
      summary: "A social layer for stable parties, mentors, and construction; referrals grow through retention and cooperation, never direct Gold minting."
      preparation: "Creation needs effective level 15 and 10,000 Gold; mentor binding and verification also check level, playtime, and journey progress."
      where: "Enter the Community Center through Social or the Commission Officer; persistent state owns every invite, bond, and project."
      npc: "Commission Officer / Community Center / Mentors and Weekly Projects"
      npc-short: "Commission Officer"
      primary: "Open Community Center"
      primary-tooltip: "View live community, mentor, invitation, member, and weekly-construction state"
      secondary: "Open Tasks and Commissions"
      secondary-tooltip: "View onboarding, resource commissions, dungeons, and events suitable for cooperation"
      lines:
        - "Communities organize stable parties, mentor bonds, and construction without extra combat stats."
        - "At effective level 15, creating one costs 10,000 Gold that permanently leaves circulation."
        - "Only newcomers at effective level 10 or below and under 360 play minutes may bind a mentor."
        - "A bond verifies only after all eight onboarding steps, effective level 15, and 180 real play minutes."
        - "Weekly projects burn contributed Gold and cap each player's contribution; referrals never mint Gold."
        - "Use /community for the center and /community help for every command."
    claims:
      title: "Homes and Player Claims"
      summary: "GriefPrevention protects vanilla-survival builds, containers, animals, and redstone; RPG hubs and dungeons do not use player claims."
      preparation: "Use /wild, place a bed and /sethome, then mark two claim corners with a golden shovel."
      where: "Create claims only in the vanilla Overworld frontier. The isolated hub, Nether, End, and dungeon instances reject player claims by default."
      npc: "Frontier Guide / Vanilla Bed Home / Player Claims"
      npc-short: "Frontier Guide"
      primary: "View My Claim Allowance"
      primary-tooltip: "Run /rpghelp claims to inspect claims and remaining block allowance"
      secondary: "Show Claim Creation Usage"
      secondary-tooltip: "Run /rpghelp claims for creation usage at your location; this does not debit Gold"
      lines:
        - "A bed owns vanilla respawn and /home. A claim prevents building damage, chest theft, fluid grief, and farm interference."
        - "Right-click two opposite corners with a golden shovel. Start with a clear small rectangle and resize it later."
        - "Use /trust for building, /containertrust for containers and crops, or /accesstrust for doors, buttons, and beds."
        - "Audit with /trustlist and revoke with /untrust; never grant full build trust to unknown players."
        - "Claim allowance grows slowly through real online time, cannot be traded or converted to Gold, and is not granted by alt-friendly starter packages."
        - "Farm output still follows shop anti-farm catalogs and commission labor proofs; owning land never creates a system buyback right."
    npcs:
      title: "Hub NPCs"
      summary: "NPCs are trusted entries and contextual explanation: they never duplicate task, economy, or loot databases or invent progress."
      preparation: "Read your current journey goal, choose its functional NPC, or use the constrained AI NPC for a free-form rules question."
      where: "Open the NPC directory from /rpghelp home. Every NPC entry starts a 60-second compass, distance bar, and low-frequency walking route."
      npc: "Guide / Commission Officer / Companion and System Mentors"
      npc-short: "Current Objective"
      primary: "Open Tasks and NPC Entries"
      primary-tooltip: "Aggregate journey, commission, dungeon, world-event, community, and guidance entries from real progress"
      secondary: "Analyze My Current State"
      secondary-tooltip: "Read class, stats, skills, gear, Energy, journey, and environment, then give one actionable recommendation"
      lines:
        - "Guide NPCs open trusted menus; trade NPCs route to the existing escrow market and stores without duplicating currency state."
        - "The Commission Officer unifies onboarding, vanilla, commission, dungeon, and event entry points; owning plugins still settle progress."
        - "The Companion first reads your class, stats, cooldowns, gear, Energy, journey, and environment, then explains the current gap and next step."
        - "Right-click the Companion for an immediate state analysis, then use /ainpc ask <question> for build, route, or system follow-ups; /ainpc leave exits."
        - "If the external AI is unavailable, slow, or saturated, a local bilingual knowledge base answers automatically."
    companions:
      title: "Bonded Companions"
      summary: "Capture and command a real creature; Codex, personality, Bond, evolution, appearances, and active abilities form its long collection path."
      preparation: "Bring a lead. Lower wild targets below 15% HP in the overworld; tame vanilla tameables before bonding them."
      where: "Capture in the overworld wilderness, then use /companion for status, paths, backpack, and storage."
      npc: "Guide / Bonded Companion Menu / Overworld Wilderness"
      npc-short: "Guide"
      primary: "Open Bonded Companions"
      primary-tooltip: "Review capture, Codex, Bond, evolution, appearances, abilities, backpack, storage, and revival"
      secondary: "Back to Community and Services"
      secondary-tooltip: "Open the shared entry for communities, tasks, guidance, visuals, and companions"
      lines:
        - "Hit a wild capturable target below 15% HP with a lead for about 25% success; a successful bond consumes the lead."
        - "Choose Guardian, Hunter, Healer, or Ranger once after capture. Level cap is 30 and storage holds four pets."
        - "Feeding, shared kills, and level milestones build Bond. Evolve at level 10 / 250 Bond and level 20 / 750 Bond."
        - "Personality and trait stay with the pet. The Codex tracks species and captures; evolution unlocks visual-only appearances."
        - "Capture grants a Bond Horn. From pet level 8, hold and right-click it for a route ability without Q, number keys, or client keybinds."
        - "Only one pet is active. It attacks hostiles and reserves 1 HP so the player must land the final hit for drops."
        - "Automatic pickup, mining, lumbering, fishing, animal products, native shops, and pet trading are disabled."
        - "Pets cannot field in the hub or dynamic dungeons, never fight players, and cannot auto-fill their death-safe backpack."
        - "Use /companion for recall, dismissal, behavior, naming, and unified-Gold early revival. Raw engine commands cannot bypass rules."

