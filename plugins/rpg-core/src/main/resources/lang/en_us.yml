    next-button-tooltip: "Run /rpghelp for the new single objective, completion check, and real entry point"
    complete-next: "All eight onboarding goals are complete. Your level, Energy, skills, and equipment now select one executable free-journey recommendation."
    complete-button: "[View Recommended Next Step]"
    complete-button-tooltip: "Open /rpghelp; the recommendation is optional, with direct alternatives for tasks, leveling, builds, equipment, economy, or NPCs"
    handbook-name: "Traveler Compass"
    handbook-name-next: "Traveler Compass · {step}"
    handbook-name-complete: "Traveler Compass · Free Journey"
    handbook-current: "Do now: {step}"
    handbook-complete: "All eight onboarding goals are complete."
    handbook-freeplay: "Right-click to choose commissions, dungeons, events, or a build."
    handbook-use: "Right-click for the current goal; press G for the full menu."
    handbook-lore:
      - "Right-click only for the single current objective and action"
      - "Press G for Quick Actions; use /menu for the full menu"
      - "Skills: /skills to learn and equip; hold a crafted weapon, tap F to cast and double-tap F to cycle"
      - "Click a Journey goal to reach its gameplay entry"
      - "/hub returns to town; /wild finds a safe frontier"
      - "Use /sethome beside a bed; use /home within the Overworld"
    handbook-drop: "The Traveler Compass cannot be dropped. Press G or use /menu instead."
    handbook-container: "The Traveler Compass cannot be placed in external containers."
    steps:
      hub:
        name: "Meet the Hub Guide"
        hint: "Visit the hub and speak with the guide in the central plaza"
        completion: "Open Guide Aqiong's real service conversation. Merely returning, walking past, or opening the main menu does not count."
        where: "Ahead of the hub spawn platform; right-click Guide Aqiong"
        why: "Learn the unified menu and service entrances instead of guessing commands"
        unlock: "The Traveler Compass points to class selection"
        action: "Visit Aqiong and Talk"
        action-tooltip: "Start compass, distance, and low-frequency path cues; right-click the Guide on arrival"
        how:
          - "Confirm the Traveler Compass is in hotbar slot 9; it cannot be dropped or stored."
          - "Choose Navigate to Guide, follow the compass and path cues, then right-click Aqiong to open the conversation."
          - "The objective records when Aqiong's real service dialog opens; then choose Open Main Menu to learn the later entries."
        rules:
          - "This step records only when Guide Aqiong's real service dialog opens; merely returning, walking past, or opening a generic menu does not count."
          - "Outside the hub, navigation first follows /hub safety rules; combat and dungeon states never force a teleport."
          - "The step and its bound Merit settle once; revisiting the NPC only reopens services."
      class:
        name: "Choose a Class"
        hint: "Choose your starting class in the class menu"
        completion: "A starter class must be saved to your character profile. Browsing, reaching the pavilion, or closing confirmation does not count."
        where: "Click for the class menu or visit the purple class pavilion ahead-left of the plaza"
        why: "Your class defines weapon bonuses, skill tree, and first combat loop"
        unlock: "Class skills and matching equipment bonuses"
        action: "No Travel: Open Six-Class Choice"
        action-tooltip: "Compare range, main attributes, and weaknesses before committing to a starting class"
        how:
          - "Compare all six classes by combat range, primary attributes, and weakness."
          - "Click a class and confirm; the base class cannot be freely rerolled afterward."
          - "After the class is saved, the refreshed menu reopens automatically; next inspect the gates for your first desired skill."
        rules:
          - "Only a class successfully persisted to your profile completes this step; browsing icons, closing confirmation, or visiting the pavilion does not."
          - "Your starting class owns its skill tree, weapon affinity, and later branches; there is currently no unrestricted free reroll."
          - "Rare cross-class gear skills expand a build without changing its authoritative base class."
      attribute:
        name: "Complete Your First Skill Build"
        hint: "Allocate all 5 starting attributes and successfully learn one class skill"
        completion: "Your profile must contain allocated attributes and the skill tree must contain at least one learned skill; both are required."
        where: "Allocate in Class and Attributes, then use its bottom Skill Tree button to learn the highlighted skill"
        why: "Leave the hub with a real castable class loop instead of only a class label"
        unlock: "Your first castable skill, mana, and cooldown feedback"
        action: "No Travel: Open Attribute Allocation"
        action-tooltip: "Spend all 5 starting points in place; the bottom Skill Tree button continues the same build"
        how:
          - "Spend all 5 by class: Healer 3 Int/2 Sta; Warrior 3 Str/2 Sta; Assassin 4 Agi/1 Sta; Mage 4 Int/1 Sta; Ranger 3 Agi/2 Str; Freeform 1 in every stat."
          - "The Class menu refreshes in place; then click its bottom Skill Tree button instead of closing it to guess a command."
          - "Click the aqua starter skill to learn it; this goal records only after both allocation and one learned skill are real."
        rules:
          - "Every class's starter skill gate consumes exactly the five initial attributes; an unmet skill cannot complete the step after a wrong allocation."
          - "The server rechecks both persisted attributes and at least one learned skill; allocating alone, reading lore, or casting an unlearned skill does not count."
          - "Each allocation and learn operation persists and refreshes in place, so consecutive clicks do not require reopening the menu."
      explore:
        name: "Complete Vanilla Exploration"
        hint: "Complete any non-recipe vanilla advancement"
        completion: "Complete any real vanilla advancement; merely unlocking a recipe does not count."
        where: "Use the green frontier guide behind the spawn platform or /wild"
        why: "Vanilla exploration and gathering supply forging and the economy"
        unlock: "Confirms that vanilla survival is feeding RPG progression"
        action: "Already in Hub: Go to Safe Frontier"
        action-tooltip: "Use the existing /wild hub, combat, in-progress, and safe-landing checks without an NPC conversation"
        how:
          - "Bring a bed, food, and basic tools; the bed is both vanilla spawn and your only home."
          - "Visit the Frontier Guide and choose safe travel; use /sethome beside the bed after arrival."
          - "Complete any non-recipe vanilla advancement, such as Stone Age by mining stone, Getting an Upgrade by crafting a stone pickaxe, or Sweet Dreams by sleeping."
        rules:
          - "Only an actually completed vanilla advancement records; recipe-only unlocks are filtered and cannot farm this goal."
          - "/wild enforces combat, dungeon, in-progress, and safe-landing checks; a failed search never drops you into an unverified chunk."
          - "Homes retain vanilla bed semantics: use /sethome beside a bed, then /home only within the Overworld."
      hunt:
        name: "Defeat an Adaptive Monster"
        hint: "Defeat one dynamically leveled monster"
        completion: "Personally defeat one hostile carrying the server's dynamic level marker. Level gap changes rewards, not this step's completion."
        where: "Find a naturally spawned hostile with a level label in the Overworld frontier"
        why: "Any level-marked adaptive kill completes the goal; Growth XP and mutation materials require a level gap under 20"
        unlock: "Adaptive materials and hunt-chain rewards"
        action: "Show My Eligible Monsters and XP"
        action-tooltip: "Read your effective level and show eligible monsters, real Growth XP, and the frontier entry"
        how:
          - "Open the Monster Guide for your effective level and recommended monster range."
          - "Find a level-marked adaptive hostile in the Overworld frontier; the Monster Guide now routes from your actual location without returning to this page."
          - "Defeat any one level-marked adaptive monster to complete the goal; only a gap under 20 grants Growth XP and RPG materials."
        rules:
          - "The objective recognizes only a server-marked adaptive monster; ordinary vanilla mobs, animals, and entities without a level marker do not count."
          - "A 20-level gap can still record that adaptive kill, but grants no Growth XP or RPG materials and retains only vanilla drops."
          - "Hunt chains apply only to natural Overworld enemies and reset under the world rules after a target change, world change, long gap, or long-distance move."
      forge:
        name: "Obtain Forged Equipment"
        hint: "Forge and hold one custom equipment item"
        completion: "A finished custom item with the server's anti-duplication signature and crafter record must enter your inventory. Opening or failing the forge does not count."
        where: "Visit the orange forge pavilion ahead-right of the plaza or use /forge"
        why: "Complete one guaranteed class forge, then combine vanilla bases and drops into long-term signed gear"
        unlock: "Item XP, slot reveals, and later refinement"
        action: "No Travel: Open the Real Forge"
        action-tooltip: "Put the package base in slot 10 and eight First-Forge Cores in slot 12; preview must show 0 Gold and 100%"
        how:
          - "After class selection, the server grants one class base and a stack of eight bound First-Forge Cores; you do not need to find a vanilla weapon first."
          - "Place the base in slot 10 and all eight cores in slot 12. The first-forge preview must show 0 Gold and 100% success."
          - "Later bases come from vanilla crafting, natural chests, villagers, mob drops, and smithing upgrades; core materials come from eligible adaptive mobs, dungeon bosses, or /salvage."
        rules:
          - "Only a signed custom item with a recorded crafter actually present in your inventory completes this step; opening or failing the forge does not."
          - "The first-forge package and result bind to you and cannot be dropped, externally stored, or marketed, preventing alt farming."
          - "Later forging revalidates its base, eight materials, Gold, and catalyst; the result persists crafter, slots, and binding state."
      reveal:
        name: "Confirm the First Slot Result"
        hint: "Confirm the roll: a zero-slot blank completes immediately; slotted gear must reveal slot one"
        completion: "A zero-slot result completes when held in inventory. Gear with slots must reveal slot one on that exact equipped or main-hand item."
        where: "Inspect the forged item's lore; use slotted gear in your hand or armor slots during real combat"
        why: "Zero-slot blanks remain tradeable; slotted gear reveals through real use instead of instant disposal"
        unlock: "A first refinable stat for slotted gear, or the free-trade route for a zero-slot blank"
        action: "Show an Eligible Combat Route"
        action-tooltip: "Read your effective level and open an eligible monster route; there is no loot-box NPC for this step"
        how:
          - "Inspect the result's lore for total slots. A zero-slot blank records the result as soon as it is in your inventory."
          - "If total slots exceed zero, hold the weapon or wear the armor while completing real Overworld or dungeon combat."
          - "The first stat appears at its item-XP threshold; storing the item never grows it passively."
        rules:
          - "Zero slots is a valid blank result and confirms in inventory; any item with slots must actually reveal at least slot one."
          - "Only the relevant custom item in the main hand or equipped armor gains item XP from eligible combat; stored and idle inventory gear does not grow."
          - "The reveal writes back to that same item; discarding it, swapping to another unrevealed item, or merely opening refinement does not complete the step."
      dungeon:
        name: "Complete Your First Dungeon"
        hint: "Finish one valid dungeon while included in its completion reward list"
        completion: "The dungeon must finish successfully with you on its reward roster. Entering, spending Energy, or landing the final hit is not itself a clear."
        where: "Visit the red expedition pavilion right of spawn and check level, Energy, and party rules"
        why: "Dungeons provide premium materials, hidden tickets, and special skill books"
        unlock: "Free choice among commissions, dungeons, and world-event routes"
        action: "No Travel: Show Eligible Dungeons"
        action-tooltip: "Inspect level, Energy, party, and ticket rules; only a successful clear with you on the reward roster records the goal"
        how:
          - "Check minimum level, personal Energy, party size, and ticket requirements in the list."
          - "Choose an eligible normal dungeon; every party member is validated and charged separately."
          - "Clear the guardian waves and boss; a successful run records every listed party member without requiring the last hit."
        how-needs-level:
          - "Use the green button to open the Monster Guide. You are effective Lv.{level}; the first gate is Lv.{minimum}."
          - "Hunt adaptive enemies in the recommended Overworld range for Growth XP; a 20-level gap grants no Growth XP."
          - "Right-click the Traveler Compass again at Lv.{minimum}; staying online while leveling also lets Energy recover on schedule."
        how-needs-energy:
          - "Use the green button for vanilla exploration, gathering, or eligible hunts instead of repeatedly hitting a locked dungeon entry."
          - "Stay online: recover {amount} Energy every {seconds} seconds. You have {energy}/{cost}; kills themselves do not restore Energy."
          - "Right-click the Traveler Compass again at {cost} Energy; the green action automatically changes to the dungeon entry."
        rules:
          - "Even the first normal dungeon rechecks every member's effective level, personal Energy, online status, same-world distance, and 1–4-player party when Enter is clicked; one failure prevents the run."
          - "Energy recovers only while online, by {amount} every {seconds} seconds up to the Stamina-based cap. Overworld kills do not restore it directly; progress vanilla content while waiting."
          - "Only players on the reward roster after a successful finish record the clear; entering, spending Energy, leaving midway, or merely landing the boss's last hit does not count."
