    soul-resonance: "Soul Resonance"
    rallying-standard: "Rallying Standard"
    ruin-charge: "Ruin Charge"
    unbroken-line: "Unbroken Line"
    void-cut: "Void Cut"
    plague-bloom: "Plague Bloom"
    vanished-horizon: "Vanished Horizon"
    ash-domain: "Ash Domain"
    time-lock: "Time Lock"
    axiomatic-break: "Axiomatic Break"
    gale-step: "Gale Step"
    pack-hunt: "Pack Hunt"
    horizon-arrow: "Horizon Arrow"
    adaptive-arsenal: "Adaptive Arsenal"
    rune-reversal: "Rune Reversal"
    open-form: "Open Form"
  descriptions:
    heal: ["Link to the lowest-health dungeon ally within 8 blocks and heal them; a mutation can instead drain the nearest enemy"]
    renewal: ["Attach a renewal seed to the lowest-health ally for four pulses; it heals its bearer and nearby allies, then retargets if the bearer leaves"]
    sanctuary: ["Anchor a six-second sanctuary that heals allies, pushes monsters off its boundary, and bends hostile projectiles away"]
    fate-seal: ["Give each nearby ally one 12-second fate seal; their next hit consumes it for mitigation while the cast immediately reverses hostile projectiles"]
    war-cry: ["Damage and launch enemies within 7 blocks while rallying nearby dungeon allies; the caster weakens afterward"]
    shield-wall: ["Raise a nine-second directional wall that mitigates only frontal hits, reflects shots, and repels melee attackers; flanking bypasses it"]
    fortress: ["Anchor a fortress core, pull and taunt monsters within 9 blocks, and gain mitigation plus knockback immunity while remaining within 4 blocks"]
    blood-rage: ["Spend 4 health to release a blood shockwave that damages and pushes nearby enemies; the cost cannot kill you"]
    shadow-step: ["Lock onto a nearby enemy and safely blink behind it for a back strike; only certain variants hide when no target exists"]
    venom-blade: ["Blink behind a target and carve a venom mark; stack up to five on ordinary enemies or three on bosses to empower later venom attacks"]
    smoke-bomb: ["Detonate expanding smoke that clears nearby monster threat, pushes them away, and briefly hides you"]
    toxic-burst: ["Immediately detonate venom marks within 7 blocks for scaling burst damage, then spread one mark from primed targets to nearby enemies"]
    fireball: ["Launch a terrain-safe fireball with its own visible flight trail and unified skill damage"]
    frost-nova: ["An expanding ice wave damages and truly locks monsters within 7 blocks, stopping movement and pursuit; bosses recover sooner"]
    meteor: ["Telegraph the aimed ground, then drop a terrain-safe meteor that damages, ignites, and launches enemies"]
    mana-surge: ["Restore 40 mana, reduce every active cooldown by 20%, and reverse nearby hostile projectiles"]
    power-shot: ["Fire a critical high-power arrow with a distinct gold flight trail"]
    volley: ["Mark the aimed area and rain seven arrows onto it in sequence"]
    piercing-shot: ["Fire a 34-block hitscan line that pierces up to four enemies on its path"]
    beast-call: ["Summon two invulnerable spirits that deal authored skill damage on a bounded attack cadence and return if separated from their owner"]
    improvisation: ["Randomly perform a shockwave, three healing pulses, projectile reversal, or a charge; risky variants can backfire"]
    second-wind: ["Restore 6 health, cleanse poison, wither, slowness, weakness, blindness, and darkness, then release a wind ring"]
    battle-trance: ["Enter an 11-second trance and release a close strike; consecutive melee hits gain 6% per stack up to five, with the fifth launching the target; 2.5 seconds idle resets stacks"]
    arcane-edge: ["Cut a 9-block arcane line through up to three enemies"]
    life-thread: ["Maintain five tethers to the lowest-health ally, healing them and transferring at most 1.25 health per pulse while always leaving the caster at one health"]
    omen-reversal: ["Strike and weaken the nearest enemy, then reverse hostile projectiles within 12 blocks"]
    soul-resonance: ["Release six resonances that heal allies within 14 blocks and echo one soul-damage strike from each ally into a nearby enemy"]
    rallying-standard: ["Plant a six-second banner that shields allies, increases their damage by 12%, and draws nearby monsters into its threat"]
    ruin-charge: ["Spend 6 unmitigated health to charge forward, striking each enemy on the path once and launching it; cannot kill you"]
    unbroken-line: ["Link allies within 14 blocks for 13 seconds; reduce incoming damage, share a bounded portion with the guardian, and raise a frontal repelling line"]
    void-cut: ["Tear space, blink behind the nearest enemy, deliver a heavy cut, and weaken the target"]
    plague-bloom: ["Bloom seven plague pulses that damage and add venom marks, then detonate every accumulated mark on the final pulse"]
    vanished-horizon: ["Blink-strike through up to three targets in sequence, leaving a readable void path after every jump"]
    ash-domain: ["Create a six-pulse ash field that repeatedly damages and ignites enemies within 10 blocks without harming terrain"]
    time-lock: ["Lock monster movement and threat within 10 blocks and suspend nearby projectiles until time resumes"]
    axiomatic-break: ["Connect arcane fracture lines to the three nearest enemies, heavily damage each, then restore 30 mana"]
    gale-step: ["Leap along the crosshair path and fire three fast arrows with visible wind trails"]
    pack-hunt: ["Mark nearby prey, summon three independently striking spirit hunters, and hasten nearby dungeon allies"]
    horizon-arrow: ["Fire a fast, deeply piercing arrow with its own long-distance trail and no generic entity outline"]
    adaptive-arsenal: ["Act from the held item: melee charges, ranged fires a piercing line, and other items release a defensive shockwave"]
    rune-reversal: ["Strike the nearest enemy, transfer one negative effect to it, reverse nearby projectiles, and restore 20 mana"]
    open-form: ["Release an eight-direction shockwave that damages and launches enemies while reversing nearby hostile projectiles"]
