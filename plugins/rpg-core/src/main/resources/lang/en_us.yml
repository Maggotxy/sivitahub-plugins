guide:
  welcome: "Welcome to SivitaHub. Right-click the Traveler Compass only for your single current objective; press G for Quick Actions or use /menu for the full menu."
  starter-kit:
    need-space: "Your class package needs {slots} empty inventory slots. Clear space and it will arrive again."
    base-name: "{class} First-Forge Base"
    base-lore: "Granted once after class selection; use it with your eight First-Forge Cores."
    core-name: "Bound First-Forge Core"
    core-lore: "A full stack of eight for your first item; cannot be traded or transferred."
    food-name: "Journey Bread"
    bed-name: "Traveler Bed"
    arrows-name: "Ranger Practice Arrows"
    claim-tool-name: "Frontier Claim Shovel"
    claim-tool-lore: "Right-click two ground corners to claim; open /menu and pick Homes and Player Claims for trust and allowance."
    claim-tool-need-space: "The claim shovel needs one empty inventory slot. Clear one and open /rpghelp to retry delivery."
    utility-lore: "Class journey supply | account-bound"
    granted: "Your class package is in your inventory; no vanilla weapon or monster material is needed first."
    title: "Your First-Forge Package"
    identity: "A base has been prepared for your {class} path."
    instruction: "Open the forge: place the base in slot 10 and all eight First-Forge Cores in slot 12, then confirm the preview."
    guarantee: "This first forge costs 0 Gold and succeeds 100%. Later forging requires a vanilla base, eight adaptive/dungeon/salvage materials, and Gold."
    bound: "The package and first result bind directly to you and cannot be moved through alts or the market."
    open-button: "Forge It Now"
    open-tooltip: "Open the real forge and follow the slot 10/12 instructions"
    later-button: "Inspect Inventory"
    later-tooltip: "Close this window; use the Forge NPC or /forge later"
  welcome-dialog:
    title: "Your First Steps in Sivita"
    identity: "This long-term RPG world connects vanilla survival, class builds, player-forged gear, and dungeon discovery."
    first-goal: "Do one thing now: meet the guide at the hub center and use your Traveler Compass to confirm the first objective."
    first-where: "The guide stands just ahead of the spawn platform under the name Guide Aqiong."
    first-why: "Each onboarding goal grants bound Merit and teaches classes, skills, the frontier, forging, and dungeons one step at a time."
    controls-short: "Right-click the Traveler Compass for your current objective, press G for quick actions, and use /hub if lost."
    loop: "Vanilla gathering, exploration, fishing, raids, and smithing feed RPG resources. Forge personal equipment, train it in combat to reveal slots, then take on stronger wilderness zones and dungeons."
    classes: "Six starting paths: Healer sustains; Warrior tanks in melee; Assassin bursts and repositions; Mage controls areas at range; Ranger kites; Freeform mixes skills but starts slower. A class grants specialization without blocking rare cross-class gear skills."
    skills: "After choosing a class, open the skill tree. Left-click learned skills to equip and right-click to upgrade. Hold a crafted weapon, tap F to cast, and double-tap F to cycle."
    route: "Recommended first route: speak to the central Guide → choose a class → allocate attributes and learn the first skill → complete the guaranteed first forge → use /wild → place a bed and /sethome → explore and hunt → reveal a slot → enter the first dungeon."
    controls: "Right-click the Traveler Compass for your current objective; press G for Quick Actions; /menu opens the full menu; /hub returns to town; /wild finds a frontier; use /sethome beside a bed, then /home in the Overworld; /back returns to your previous safe location."
    classes-button: "Compare Six Classes"
    classes-button-tooltip: "Review each role, core attributes, and tradeoffs"
    start-button: "Start First Objective"
    start-button-tooltip: "Open the current objective, location, purpose, and direct entry"
    skills-button: "Learn, Equip, and Upgrade"
    skills-button-tooltip: "Choose a class if needed, then inspect gates, left/right-click controls, ascension level caps, and real cooldowns"
    journey-button: "Open Eight-Step Journey"
    journey-button-tooltip: "See the next objective; click each step to reach its entry point"
    menu-button: "Open Main Menu"
    menu-button-tooltip: "Access gameplay, help, trading, and visual settings"
    later-button: "Explore Later"
    later-tooltip: "Close this page; the compass and /rpghelp always continue your current objective directly"
