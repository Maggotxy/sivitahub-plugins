  no-permission: "你没有权限重载 AI NPC。"
  suggestion-analyze: "重新分析我的状态"
  suggestion-analyze-tooltip: "读取当前职业、五维、技能、装备、体力、旅程与环境，只做建议不改数据"
  suggestion-build: "我的构筑有什么问题？"
  suggestion-forge: "装备怎样锻造？"
  suggestion-quests: "我现在该做什么任务？"
  suggestion-economy: "金币、功勋和星辉怎样循环？"
  suggestion-dungeons: "副本和隐藏关怎么进？"
  analysis-title: "—— 小栖给你的建议 ——"
