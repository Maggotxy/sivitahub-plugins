  welcome-dialog:
    title: "第一次来到希维塔大陆"
    identity: "这里是把原版生存、职业构筑、自铸装备和副本探秘连在一起的长期 RPG 世界。"
    first-goal: "现在只做一件事：找到主城中央的引路人，打开旅者罗盘确认第一项目标。"
    first-where: "就在出生平台前方；头顶写着“引路人 · 阿穹”。"
    first-why: "每项入门目标都会获得功勋，并逐步学会职业、技能、首铸、荒野与副本。"
    controls-short: "右键热栏旅者罗盘继续当前目标；按 G 打开快捷操作；迷路时使用 /hub。"
    loop: "原版采集、探索、钓鱼、袭击与锻造都会产出 RPG 所需资源；用材料自铸装备，在战斗中养成并逐步揭示属性槽，再挑战更高等级的荒野与副本。"
    classes: "六种起点：奶妈治疗续航；战士近战承伤；刺客爆发位移；法师远程范围；游侠持续风筝；散人自由跨职但前期较慢。职业决定专精，不会封死装备中的跨职稀有技能。"
    skills: "选择职业后打开技能树：满足五维与技能点条件即可学习；左键装配、右键升级。手持自制武器时单按 F 施放当前技能、双按 F 切换技能。"
    route: "推荐第一程：与中央引路人交谈 → 选择职业 → 分配五维并学会首技 → /forge 完成保底首铸 → /wild 前往安全荒野 → 放床并 /sethome → 探索狩猎 → 逐步揭槽 → 进入首个副本。"
    controls: "右键旅者罗盘展开当前唯一目标；按 G 打开快捷操作；/menu 打开总菜单；/hub 回主城；/wild 前往荒野；床旁 /sethome 后可在主世界用 /home；/back 返回上一处安全位置。"
