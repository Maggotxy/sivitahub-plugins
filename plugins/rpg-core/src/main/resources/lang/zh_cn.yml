  help:
    invalid: "帮助主题不存在。使用 /rpghelp 查看当前目标，或 /rpghelp home 打开帮助首页。"
    start:
      title: "入门路线"
      summary: "由真实进度驱动的八步旅程，每次只告诉你当前最该完成的一件事。"
      preparation: "不需要预存物品；先确认当前目标，再按目的地前往，完成条件会自动记录。"
      where: "主城出生平台正前方找引路人，或右键物品栏第 9 格的旅者罗盘。"
      npc: "引路人 / 旅者罗盘 / 新手旅程菜单"
      npc-short: "当前目标"
      primary: "继续当前目标"
      primary-tooltip: "打开八步旅程并突出当前唯一目标、地点和解锁内容"
      secondary: "查看巡路与剧情"
      secondary-tooltip: "打开序章巡路状态；三分钟巡路是可选介绍，不替代八步成长"
      lines:
        - "先选择职业并分配五维属性。"
        - "打开 /skills：满足条件后学习并左键装配；手持自制武器时单按 F 施放、双按 F 切换。"
        - "职业礼包提供首铸装备胚和 8 个核心；先用 /forge 完成 0 金币、100% 成功的首铸。"
        - "从主城用 /wild 前往荒野，放置床并在床旁使用 /sethome；/home 只在主世界可用。"
        - "完成原版探索和野外狩猎，积累后续锻造材料、金币与功勋。"
        - "装备会在使用中获得经验并逐步揭示属性槽。"
        - "使用 /visuals 调整粒子和玩法音效，不影响任何数值。"
    tasks:
      title: "任务、委托与活动"
      summary: "把一次性入门、每日资源委托、副本、世界事件和社群周目标放在同一入口，但完成状态仍由各真实玩法结算。"
      preparation: "委托需要 60 分钟游玩、劳动记录和对应材料；副本需要等级、体力、队伍，部分还需要门票。"
      where: "右键主城的“委托官 · 拾简”，或使用 /tasks；该页会把你继续送到委托、副本、世界状态或当前旅程。"
      npc: "委托官 / 任务与委托中心 / 各玩法真实入口"
      npc-short: "委托官"
      primary: "打开任务与委托中心"
      primary-tooltip: "查看当前入门目标、今日资源委托、副本、世界事件、原版共鸣、社群和任务邮箱"
      secondary: "查看今日资源委托"
      secondary-tooltip: "读取今日轮换、材料、主动劳作证明、个人次数和真实奖励额度"
      lines:
        - "八步入门是一条只完成一次的教学路线；页面会显示唯一下一步、完成判定和直接入口。"
        - "资源委托每天轮换三项、每项一次且账号合计三次；物品会真实移除，还需绑定的主动劳作证明，自动农场库存不能单独铸币。"
        - "副本按个人等级、体力、队伍和门票逐人核验；只有成功通关且进入奖励名单才算完成。"
        - "血月、连猎和原版共鸣不需要先接一张虚构任务卡；真实击杀、采集、钓鱼、进度和袭击会直接推进所属系统。"
        - "序章巡路只负责认识主城和玩法，不替代八步成长；社群每周工程是多人金币销毁目标，不直接制造金币。"
        - "点击确认时会重新核对条件、费用、奖励和次数；关闭菜单不会丢失进度。"
    profile:
      title: "角色成长"
      summary: "独立于原版经验球的角色等级、转生、五维点、技能点和副本体力。"
      preparation: "无需道具；升级主要来自等级相近的动态怪和副本首领。"
      where: "任何地点都能打开角色档案；荒野升级建议另看动态怪指南。"
      npc: "引路人 / 角色档案 / 动态怪指南"
      npc-short: "引路人"
      primary: "打开角色档案"
      primary-tooltip: "查看等级、经验、五维、体力和当前职业的实时数值"
      secondary: "查看升级路线"
      secondary-tooltip: "按你的有效等级显示合格怪物区间、击杀经验和下个副本"
      lines:
        - "0 转上限 30 级，后续阶段由全服章节逐步开放。"
        - "升级获得属性点，每 3 级获得技能点。"
        - "体力用于进入副本，耐力会提高体力上限。"
        - "动态野怪与副本首领提供角色成长经验；原版经验球仍只用于附魔和修补。"
        - "使用 /rpg 或按住 TAB 查看当前/下级经验；/mobguide 查看当前推荐打怪地点与副本。"
    classes:
      title: "职业与五维"
      summary: "六个起始职业决定技能树与武器偏好，五维属性决定技能学习资格和构筑方向。"
      preparation: "职业首次选择后不可随意更改；先读技能门槛，再连续分配可用五维点。"
      where: "主城紫色职业亭找职业导师，或在任意安全位置打开职业菜单。"
      npc: "职业导师 / 职业与五维菜单 / 技能树"
      npc-short: "职业导师"
      primary: "选择职业与加点"
      primary-tooltip: "打开可原位连续分配的职业、五维与晋升菜单"
      secondary: "查看技能树"
      secondary-tooltip: "核对当前职业技能及每项五维、等级和技能点门槛"
      lines:
        - "初始职业：奶妈、战士、刺客、法师、游侠、散人。"
        - "防御、力量、敏捷、智力、耐力共同决定技能和构筑。"
        - "5 点起手构筑：奶妈 3 智 2 耐；战士 3 力 2 耐；刺客 4 敏 1 耐；法师 4 智 1 耐；游侠 3 敏 2 力；散人五维各 1，均可立即学习首技。"
        - "职业提高对应武器效率，稀有装备技能允许跨职业构筑。"
    equipment:
      title: "锻造与装备"
      summary: "把原版胚材、RPG 掉落和可选催化剂合成为带锻造者署名、会成长的个人装备。"
      preparation: "主手准备合格原版装备胚，并携带至少 8 个核心材料、金币和可选锻纹。"
      where: "主城橙色锻造亭找锻造师；装备成品后击败敌人积累装备经验。"
      npc: "锻造师 / 锻造界面 / 强化师"
      npc-short: "锻造师"
      primary: "打开锻造台"
      primary-tooltip: "打开真实锻造界面，逐槽检查胚材、材料、金币、概率与产物"
      secondary: "查看后续养成"
      secondary-tooltip: "打开精炼、突破、传承、解绑和分解入口"
      lines:
        - "职业首铸使用礼包胚材和 8 个核心，0 金币且 100% 成功；后续普通锻造需要原版装备胚、8 个材料与 250 金币基础费。"
        - "原版胚材品质和随机品质共同决定成功率、槽位上限与成长空间。"
        - "原版附魔、铁砧重命名、饰纹和钻石升下界合金可继续使用；自制装备不消耗耐久，砂轮不能处理玩法物品。"
        - "装备首次用于战斗时绑定，锻造者信息永久保留。"
        - "有属性槽的装备在无传承成功时有 1.5% 概率获得稀有特性；当前 10 项等权，单项约 0.15%，全部揭示前不会显示或生效。"
        - "绑定或强化装备用 /unbind 支付动态金币回收费后才能进入托管市场。"
        - "多余自制装备可用 /salvage 永久分解为绑定锻造精华。"
        - "带稀有特性、槽位全揭示且至少突破 2 级的绑定装备用 /legacy 献祭为传承蓝图；蓝图不复制数值。"
    sulfur:
      title: "26.2 硫灵锻纹"
      summary: "利用 26.2 硫磺方块生物和原版材料制作定向锻纹，为装备精炼增加可控但不保底的偏向。"
      preparation: "先合成空白锻纹，再准备剪刀和一种受支持的原版方块；成品会绑定账号。"
      where: "主世界寻找硫磺方块生物完成喂养与剪取；回主城锻造亭把锻纹放入第 22 槽。"
      npc: "锻造师 / 锻纹状态 / 锻造界面"
      npc-short: "锻造师"
      primary: "查看锻纹状态"
      primary-tooltip: "查看今日剪取额度、冷却、材料偏向和完整 26.2 交互说明"
      secondary: "带锻纹去锻造"
      secondary-tooltip: "打开锻造界面；第 22 槽只接受属于你的锻纹"
      lines:
        - "用 1 张纸、2 个硫磺和 1 个朱砂合成空白锻纹。"
        - "向硫磺方块生物喂入受支持的原版方块；主手持剪刀、另一只手持空白锻纹进行剪取。"
        - "木材偏敏捷、矿石偏防御、金属偏力量、羊毛偏智力、蜂蜜偏治疗、冰与硫磺偏技能急速、朱砂偏暴击。"
        - "锻纹放入锻造界面第 22 槽，只提高目标属性的精炼权重，不改变强化成功率，也不保证目标词条。"
        - "普通锻纹目标属性约 26.3%，强共鸣约 31.7%；不使用时每种属性仍为 12.5%。"
        - "成品锻纹账号绑定，每日最多剪取 6 枚，同一生物剪取后有 5 分钟冷却。使用 /imprint 查看额度。"
    mobs:
      title: "动态野怪"
      summary: "主世界自然敌怪会按附近玩家等级动态强化，提供成长经验、装备材料和精英挑战。"
      preparation: "先选职业并分配属性；携带食物、床和符合当前构筑的装备，避免挑战差距 20 级以上目标。"
      where: "先安全返回主城，再找绿色拓荒向导或用 /wild 前往保护区外主世界荒野。"
      npc: "拓荒向导 / 动态怪指南 / 世界状态"
      npc-short: "拓荒向导"
      primary: "查看适级怪与经验"
      primary-tooltip: "读取你的等级并显示动态怪区间、真实击杀经验和下一副本"
      secondary: "查看血月与连猎"
      secondary-tooltip: "查看实时血月倒计时、当前连猎目标、层数和重置条件"
      lines:
        - "本服没有固定等级刷怪区：使用 /wild 进入主世界荒野，自然敌对怪会按最近玩家的有效等级 -3 至 +6 动态生成。"
        - "击杀合格动态怪会获得角色成长经验；精英怪明显更高，使用 /mobguide 查看当前等级的实际区间。"
        - "怪物与击杀者相差 20 级或更多时，没有成长经验与 RPG 材料，只有原版掉落。"
        - "精英怪、血月怪提供更高材料率，并受每日经济额度约束。"
        - "使用 /mobguide 查看当前经验、还差多少升级、推荐副本及实际副本经验。"
    dungeons:
      title: "副本"
      summary: "消耗每名成员体力的 1–4 人独立实例，包含守卫波次、普通首领和可保底的隐藏入口。"
      preparation: "全队需在线、与队长同世界且相距 24 格内，并分别满足等级、体力和门票条件。"
      where: "主城红色远征亭找远征官；先在副本菜单看清每个入口的实时门槛。"
      npc: "远征官 / 副本选择 / 队伍状态"
      npc-short: "远征官"
      primary: "选择可进入副本"
      primary-tooltip: "打开真实副本入口；点击前可看到等级、体力、队伍与隐藏门票条件"
      secondary: "查看队伍状态"
      secondary-tooltip: "确认队长、成员和当前组队状态，不会直接扣除体力"
      lines:
        - "副本支持 1-4 人共享实例；创建队伍后由队长发起整队入场。"
        - "成员须在线、在队长同世界 24 格内，并各自满足等级、体力和门票条件。"
        - "每名成员分别消耗体力和门票；建图、排队或传送失败会自动返还体力。"
        - "副本先完成配置化守卫波次再挑战首领，奖励按实例内在线成员分别结算。"
        - "普通首领可掉落隐藏关门票，并带有保底计数。"
        - "隐藏首领提供更高品质材料和特殊技能书。"
        - "队伍命令：/dungeon party create|invite|accept|leave|kick|disband|info。"
    enhancement:
      title: "强化与变异"
      summary: "围绕已揭示属性槽进行随机精炼、装备突破和技能变异，以金币与材料作为长期回收口。"
      preparation: "准备符合入口要求的自制装备、已揭示槽、金币和对应材料；先在预览中确认风险。"
      where: "主城青色强化亭找强化师；保护石和幸运符可从功勋或星辉路线获得。"
      npc: "强化师 / 装备养成菜单 / 功勋商店"
      npc-short: "强化师"
      primary: "打开装备养成"
      primary-tooltip: "进入精炼、突破、变异、分解、传承和解绑的归属入口"
      secondary: "查看功勋保护物"
      secondary-tooltip: "打开真实功勋商店，核对保护石等商品的余额、价格与限额"
      lines:
        - "精炼每次 400 金币，随机覆盖一个已揭示槽位，可能出现负面结果。"
        - "突破费用为 1200 × 目标阶段；保护石阻止失败惩罚，幸运符提高成功率，命令加 safe/lucky 才会消耗。"
        - "技能变异每次 3500 金币；可支付 900 金币恢复原式。"
        - "保护石可用 4500 金币+30 功勋或 60 星辉购买；幸运符可用 2200 金币+12 功勋或 30 星辉购买。"
    skills:
      title: "技能树"
      summary: "职业技能、装备借技与同名符文精通共用一套法力、冷却和战斗缩放的主动技能体系。"
      preparation: "先确定职业并学习本职技能；想借用其他技能，需要找到带技能符文的装备，揭示全部槽位并绑定给自己。"
      where: "主城蓝色技能亭找技能导师，或在任意可操作位置打开技能树；按住 TAB 看冷却摘要。"
      npc: "技能导师 / 技能树 / 职业与五维菜单"
      npc-short: "技能导师"
      primary: "打开技能树"
      primary-tooltip: "连续学习可学技能；左键装配，右键升级"
      secondary: "调整职业与五维"
      secondary-tooltip: "返回职业菜单，按目标技能的真实门槛连续分配属性"
      lines:
        - "学习技能需要职业、五维属性和技能点同时满足。"
        - "六种装备符文对应治愈术、狂吼、影步、火球术、强力射击和临机应变；已激活的跨职技能会直接出现在 /skills。"
        - "符文只有在装备全部槽位揭示并绑定本人后才会激活；卸下、解绑或装备损坏都会失去借技。"
        - "借用版约 65% 威力或持续、1.5 倍法力和冷却，并在施放后虚弱与发光 3 秒；狂吼退化为个人版。"
        - "已学习同名技能再装备符文会变成精通：最高 115% 输出或持续、0.85 倍基础冷却；同名符文不叠加。"
        - "火球和箭会在发射时冻结借用威力，之后仍受玩家 0.50、Boss 0.75 缩放，换装不能绕过。"
        - "隐藏技能书来自特殊首领、事件和可复现的隐藏条件。"
    market:
      title: "市场与绑定"
      summary: "使用持久化托管和邮箱完成玩家间高价值交易，金币转移时由系统永久回收交易税。"
      preparation: "购买先准备金币；出售时主手持待售物，绑定、账号绑定、数量和价格会由服务端核验。"
      where: "主城绿色市场亭找市场经纪；成交、撤单和系统商品统一从持久化邮箱领取。"
      npc: "市场经纪 / 托管市场 / 持久化邮箱"
      npc-short: "市场经纪"
      primary: "打开托管市场"
      primary-tooltip: "浏览真实挂牌并使用原生确认页购买，费用与交付在同一事务结算"
      secondary: "领取邮箱物品"
      secondary-tooltip: "领取成交、撤单和系统商品；断线后仍可继续领取"
      lines:
        - "高价值物品通过托管市场成交，交易税会永久回收金币。"
        - "动态怪材料、血月材料、副本核心、门票和技能书禁止私下转移。"
        - "未强化白板装备可以上架，已绑定或账号绑定物品不可交易。"
        - "原版普通物资可整组上架；自制装备每次只能托管一件。"
        - "成交和系统商品通过持久化邮箱领取，断线不会丢失。"
    economy:
      title: "财富体系"
      summary: "金币负责玩家流通，功勋和星辉绑定账户；三者以有损、限额兑换形成同一套可肝财富体系。"
      preparation: "先查看余额和周期额度；资源委托还要求主动劳作证明、游玩时长和个人限额。"
      where: "主城金色财富亭找财富管家，或从统一菜单进入财富、委托、商店和玩家市场。"
      npc: "财富管家 / 财富中心 / 资源委托"
      npc-short: "财富管家"
      primary: "打开财富中心"
      primary-tooltip: "查看余额、委托、功勋商店、有损兑换、原版共鸣和轮换商人"
      secondary: "查看今日资源委托"
      secondary-tooltip: "读取今日轮换、主动劳作要求、完成进度和个人额度"
      lines:
        - "金币可交易；功勋与星辉绑定账户，不能由玩家直接转账。"
        - "三类财富可按固定损耗配方兑换，并有日、周额度。"
        - "星辉既可由游戏进度产出，也可由管理员用唯一流水发放。"
        - "所有数值商品都有游戏内获取路径，来源不改变最终上限。"
        - "采集、钓鱼、成就与袭击同时为锻造、装备经验、委托和市场提供入口。"
        - "自动农场材料可用于建设和玩家交易，但系统不会无条件固定价回收；材料本身不能直接铸币。"
        - "资源委托还需不可交易的主动劳作证明、60 分钟游玩时长、每日轮换和个人限额。"
        - "日用品补给是高价且限量的价格上限，只销毁金币；玩家市场只转移金币并收税。"
    world:
      title: "血月与连猎"
      summary: "把原版昼夜、自然刷怪和连续狩猎结合成等待体力恢复时仍可推进的主世界循环。"
      preparation: "必须在主世界保护区外击杀合格自然敌怪；确定一种目标后避免误杀其他生物或远距离换点。"
      where: "从主城拓荒向导进入荒野；血月只影响主世界自然敌怪，副本不参与连猎。"
      npc: "拓荒向导 / 世界状态 / 动态怪指南"
      npc-short: "拓荒向导"
      primary: "查看实时世界状态"
      primary-tooltip: "显示血月倒计时、当前连猎目标、层数、加成、剩余时间和重置原因"
      secondary: "查看适级狩猎"
      secondary-tooltip: "确认你的有效等级、合格动态怪范围、成长经验和推荐副本"
      lines:
        - "每 7 个完整原版夜晚触发一次血月，仅强化主世界自然生成的敌对怪。"
        - "连续击杀完全相同的合格动态敌怪可叠加专属材料概率：第 1 只为 0%，之后每层 +0.2%，最高 +8%。"
        - "改杀其他生物、相隔超过 300 秒、跨世界，或远距离传送/换点超过 128 格都会重置连猎。"
        - "使用 /worldstatus 查看距离下次血月还有几个原版夜晚，以及当前连猎目标、层数、概率和剩余时间。"
    store:
      title: "星辉与会员"
      summary: "统一财富体系中的高门槛绑定路线，提供同上限养成物与永久外观，不创造付费专属战力。"
      preparation: "先确认星辉余额、商品限额和游戏内来源；会员是限时便利，不替代成长进度。"
      where: "通过统一菜单或财富管家进入星辉商店；管理员发放必须带唯一审计流水。"
      npc: "财富管家 / 星辉商店 / 外观设置"
      npc-short: "财富管家"
      primary: "打开星辉商店"
      primary-tooltip: "查看实时星辉余额、养成保护物、会员和永久外观解锁"
      secondary: "查看财富兑换"
      secondary-tooltip: "了解星辉的可肝来源、有损兑换和周期额度"
      lines:
        - "星辉是统一财富体系中的绑定货币，不代表专属付费上限。"
        - "管理员发放星辉必须使用唯一流水号，所有变动可审计。"
        - "星辉商品与肝取商品效果相同，且共享最终养成上限。"
        - "星辉兑换存在损耗和周期额度，不能循环套利。"
        - "幻彩共鸣只是外观；可由高额星辉肝取，也可作为累计支持奖励获得。"
        - "共鸣双翼和星坠彗尾属于永久外观解锁，可用游戏内获得的星辉兑换。"
    community:
      title: "社群与师徒"
      summary: "服务固定队、师徒和共同建设的社交层；推广来自真实留存与协作，不凭拉人直接铸造金币。"
      preparation: "建会需有效等级 15 与 10000 金币；师徒绑定和验证还会检查新人等级、游玩时长与旅程进度。"
      where: "从社交菜单或委托官进入社群中心；所有邀请、绑定和工程都由持久化状态结算。"
      npc: "委托官 / 社群中心 / 师徒与每周工程"
      npc-short: "委托官"
      primary: "打开社群中心"
      primary-tooltip: "查看社群、师徒、邀请、成员与每周建设的真实状态"
      secondary: "打开任务与委托"
      secondary-tooltip: "查看可共同完成的新手旅程、资源委托、副本和活动入口"
      lines:
        - "社群用于固定队协作、师徒共鸣与共同建设，不提供额外战斗属性。"
        - "达到有效等级 15 后可支付 10000 金币建会；这笔金币永久退出流通。"
        - "只有有效等级不高于 10 且游玩不超过 360 分钟的新人可以绑定导师。"
        - "学徒完成八步新手旅程、达到有效等级 15 且实际游玩 180 分钟后才会验证。"
        - "每周工程永久销毁成员投入的金币，并限制每名玩家的周投入；不会通过拉人铸造金币。"
        - "使用 /community 打开社群中心，/community help 查看完整命令。"
    claims:
      title: "家园与玩家领地"
      summary: "用成熟的 GriefPrevention 保护原版生存建筑、容器、动物与红石；RPG 主城和副本不参与玩家圈地。"
      preparation: "先用 /wild 到生存世界、放置床并在床旁 /sethome；再用金铲标记领地两个对角点。"
      where: "仅在原版主世界荒野建立领地；独立主城、下界、末地与副本实例默认禁止玩家圈地。"
      npc: "拓荒向导 / 原版床家园 / 玩家领地"
      npc-short: "拓荒向导"
      primary: "查看我的领地额度"
      primary-tooltip: "执行 /claimslist，查看已有领地与剩余方块额度"
      secondary: "查看圈地操作提示"
      secondary-tooltip: "执行 /claim 查看当前位置的领地创建用法；不会自动扣金币"
      lines:
        - "床负责原版重生与 /home；领地负责防止他人破坏、偷箱、乱放液体和干扰农场，两者职责不同。"
        - "手持金铲右键两个对角点建立矩形领地；首次范围保持小而明确，之后可移动角点扩建。"
        - "使用 /trust 玩家名 授予建造，/containertrust 只开放容器与农作物，/accesstrust 只开放门、按钮和床。"
        - "使用 /trustlist 核对授权，/untrust 玩家名 撤销；不要把陌生人直接授予完整建造权限。"
        - "领地方块按真实在线时长缓慢增长，不能交易、不能提现为金币，也不会由小号礼包直接发放。"
        - "自动农场产物仍受服务器商店防刷目录与委托劳作证明约束；拥有领地不等于获得系统收购权。"
    npcs:
      title: "主城 NPC"
      summary: "NPC 是可信玩法入口与情境解释层：它们不复制任务、经济或掉落数据库，也不会伪造进度。"
      preparation: "先看当前旅程目标；需要规则解释时找对应职能 NPC，需要自由提问时找受限智能 NPC。"
      where: "从 /rpghelp home 打开 NPC 目录：选择 NPC 后会开启 60 秒罗盘、距离条与低频路径导航。"
      npc: "引路人 / 委托官 / 同行者与各玩法导师"
      npc-short: "当前目标"
      primary: "打开任务与 NPC 入口"
      primary-tooltip: "按真实进度汇总旅程、委托、副本、世界事件、社群与问答入口"
      secondary: "分析我的当前状态"
      secondary-tooltip: "读取职业、五维、技能、装备、体力、旅程与环境，再给出一条可执行建议"
      lines:
        - "引导 NPC 打开可信菜单；交易 NPC 只打开现有托管市场和商店，不复制货币状态。"
        - "委托官汇总新手、原版、委托、副本和活动入口，真实进度仍由对应玩法插件结算。"
        - "同行者会先读取你的职业、五维、技能冷却、装备、体力、旅程与当前环境，再说明卡点和下一步。"
        - "右键同行者可立即分析状态，也可继续用 /ainpc ask <问题> 追问构筑、路线或玩法；/ainpc leave 退出。"
        - "外部 AI 不可用、超时或繁忙时会自动切换到本地中英文知识库，不影响其他玩法。"
    companions:
      title: "灵契伙伴"
      summary: "捕获、培养并指挥一只真实生物伙伴；图鉴、性格、亲密、突破、外观和主动技能组成长期收集线。"
      preparation: "带上拴绳。野生目标需在主世界压到 15% 生命以下；原版可驯服生物要先完成驯服。"
      where: "在主世界野外完成捕获；随时使用 /companion 查看状态、路线、旅囊和仓库。"
      npc: "引路人 / 灵契伙伴菜单 / 主世界野外"
      npc-short: "引路人"
      primary: "打开灵契伙伴"
      primary-tooltip: "查看捕获、图鉴、亲密、突破、外观、路线技能、旅囊、仓库与复苏"
      secondary: "返回社群与服务"
      secondary-tooltip: "打开社群、任务、智能建议、视觉设置和灵契伙伴的统一入口"
      lines:
        - "野生可捕获目标低于 15% 生命时，手持拴绳攻击约有 25% 成功率；成功会消耗拴绳。"
        - "捕获后从御守、猎锋、灵愈、远巡中选择一次培养路线；最高 30 级，最多存放 4 只。"
        - "投喂、共同击杀和等级里程碑增加亲密；10级/250亲密、20级/750亲密可各完成一次突破。"
        - "性格与特质稳定绑定宠物；图鉴永久记录捕获物种和次数，突破解锁纯外观收藏。"
        - "捕获会获得灵契号角。宠物8级后手持号角右键释放路线主动技能，不占 Q、数字键或客户端热键。"
        - "同一时间只出战一只。宠物只攻击敌对生物，直接伤害会保留 1 点生命，由玩家完成最后一击才有掉落。"
        - "自动拾取、挖矿、伐木、钓鱼、生物产物、原生商店和宠物交易全部关闭。"
        - "主城与动态副本禁止出战，PvP 永久关闭；旅囊死亡不掉落，但不能自动捡物。"
        - "使用 /companion 管理召回、收回、行为、改名与统一金币提前复苏；原始引擎命令无法绕过规则。"

ai-npc:
  name: "同行者 · 小栖"
