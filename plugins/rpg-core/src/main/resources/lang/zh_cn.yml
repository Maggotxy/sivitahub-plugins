  analysis-profile: "角色 · {class} · {ascension}转 Lv.{level} · 体力 {energy}/{cap}"
  analysis-attributes: "五维 · 力{strength} 敏{agility} 智{intelligence} 防{defense} 耐{stamina} · 待分配 {unspent}"
  analysis-skills: "技能 · {ready}/{learned} 就绪 · 可用技能点 {points}"
  analysis-equipment: "装备 · {items} 件自制装备 · 已揭示 {revealed} 槽 · 主手 {held}"
  analysis-next: "判断 · {advice}"
  analysis-action: "现在做 · {action}"
  advice:
    hub: "先完成一次主城认识，之后所有入口都能从罗盘再次找到。"
    class: "尚未确定职业，技能、装备加成和五维路线都无法形成。"
    attributes: "还有五维点未分配；先完成起手加点，才能满足第一个技能的门槛。"
    skills: "当前没有可用技能或仍有技能点；先学习/升级一项与你职业匹配的技能。"
    explore: "下一处缺口是原版探索；去预生成荒野建立床家并完成一个非配方进度。"
    hunt: "需要击败与你等级接近的动态怪物；等级差 20 以上只有原版掉落。"
    forge: "还未把原版胚材和 RPG 掉落接成自制装备，后续揭槽与精炼因此无法开始。"
    reveal: "把自制装备拿在主手或穿上护甲，击败敌人积累装备经验，逐步揭示属性槽。"
    dungeon: "当前成长链已允许挑战副本；先核对体力、等级与队伍，再选择匹配难度。"
    recovery: "当前体力不足以稳定进入副本，先做原版探索、狩猎或资源委托。"
  actions:
    hub: "右键旅者罗盘，选择‘当前目标’，并沿导航走到引路人。"
    class: "按 G → 成长构筑 → 职业与五维，比较六职业后确认。"
    attributes: "按 G → 成长构筑 → 职业与五维，连续点击推荐五维，再进入技能树。"
    skills: "使用 /skills 打开技能树；右侧战斗界面显示四个装配技能与冷却，TAB 显示职业、等级和最多两个技能状态。"
    explore: "沿罗盘导航到拓荒向导，带一张床使用 /wild，抵达后 /sethome。"
