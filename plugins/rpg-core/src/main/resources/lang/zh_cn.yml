    horizon-arrow: "远界之矢"
    adaptive-arsenal: "万兵适应"
    rune-reversal: "符文逆转"
    open-form: "无定式"
  descriptions:
    heal: ["生命丝线连接 8 格内生命比例最低的副本队友并治疗；变异后可转为抽取最近敌人的生命"]
    renewal: ["将复苏种子附在生命比例最低的队友身上，连续 4 次治疗携带者，并小幅治疗其身边队友；携带者离开后会重新择主"]
    sanctuary: ["在脚下固定展开 6 秒圣域，治疗范围内队友；领域边缘会持续推开怪物并折返敌对弹道"]
    fate-seal: ["为 12 格内队友各留下一枚持续 12 秒的命印；下一次受击会消耗命印并减伤，同时立即反射范围内敌对弹道"]
    war-cry: ["震开 7 格内敌人并造成伤害，同时鼓舞附近副本队友；效果结束后施法者会短暂虚弱"]
    shield-wall: ["在面前展开持续 9 秒的定向盾墙：只格挡正面伤害，反弹弹道并推开近战者；背后攻击可绕过盾墙"]
    fortress: ["以脚下位置为堡垒核心，牵引 9 格内怪物并强制其攻击你；守在核心 4 格内可减伤且不会被击退，离开即失效"]
    blood-rage: ["消耗 4 点生命释放血色震波，伤害并推开近身敌人；消耗不会让你死亡"]
    shadow-step: ["锁定附近目标并安全闪现至其背后完成突袭；没有目标时仅特定变体可进入隐匿"]
    venom-blade: ["闪至目标背后刻下毒印；同一目标可叠 5 层、Boss 最多 3 层，层数会强化后续毒刃与毒爆伤害"]
    smoke-bomb: ["在脚下引爆扩散烟幕，清空附近怪物仇恨并推开它们，自身短暂隐身"]
    toxic-burst: ["立即引爆 7 格内敌人的毒印，层数越高爆发越强；有毒印的目标还会把 1 层毒传播给附近敌人"]
    fireball: ["向准星发射不点燃、不破坏方块的小型火球；借用/精通的 65%/115% 弹道威力会在统一 PVE、Boss、PVP 结算前生效"]
    frost-nova: ["冰环向外扩散，伤害并真正冻结 7 格内怪物：停止移动、停止追击；Boss 控制时间会缩短"]
    meteor: ["在准星落点显示预警，短暂延迟后陨火从空中坠落，范围伤害、点燃并击飞敌人；不会破坏地形"]
    mana-surge: ["恢复 40 法力、缩短所有进行中冷却的 20%，并反转身边敌对弹道"]
    power-shot: ["射出 1 支 2.2 倍基础箭伤的暴击箭；装备借用/精通再按 65%/115% 调整，并继续接受 Boss、PVP 缩放"]
    volley: ["标记准星区域，随后 7 支箭从空中分批落下，覆盖而非扇形乱射"]
    piercing-shot: ["射出一条 34 格贯穿射线，依次命中最多 4 个处于弹道上的敌人"]
    beast-call: ["召来两只无敌兽灵；兽灵依靠统一技能伤害主动扑击目标而非原版狼伤害，离开过远会回到主人身边"]
    improvisation: ["随机执行震波、三段自愈、弹道反转或冲锋中的一种动作；高风险变体可能附带短暂反噬"]
    second-wind: ["恢复 6 点生命，清除中毒、凋零、缓慢、虚弱、失明与黑暗，并释放退敌风环"]
    battle-trance: ["进入 11 秒战意并释放近身震击；连续近战每层增伤 6%，最多 5 层，第 5 层击飞，停手 2.5 秒重置"]
    arcane-edge: ["挥出 9 格奥术直线斩，沿路径贯穿最多 3 个敌人"]
    life-thread: ["锁定生命比例最低的队友维持 5 次生命织线；每次治疗并最多转移自身 1.25 点生命，始终为自己保留至少 1 点生命"]
    omen-reversal: ["重创并削弱最近敌人，同时将 12 格内的敌对弹道倒转为己方弹道"]
    soul-resonance: ["释放 6 次灵魂共鸣：治疗 14 格内队友，并从每名队友身上向最近敌人弹射一道灵魂伤害"]
    rallying-standard: ["在脚下立下持续 6 秒的战旗；领域内队友获得护盾且造成伤害提高 12%，怪物会被战旗吸引"]
