    - "§f/story status §7查看序章与核心旅程；§f/story next §7直接打开当前真实目标。"
    - "§f/story start §7开始或恢复巡路；后续目标会随你的职业、装备、探索和战斗自动推进。"
    - "§f/story claim §7重新领取尚未到账的奖励；§f/story cancel §7放弃当前巡路，之后可重开。"
    - "§7也可以在主城与§f主城导览 · 栖枝§7交谈，开始约 3 分钟的可选步行导览。"
  status: "主城巡路：{state}｜当前入门目标：{next}"
  status-panel:
    title: "我现在该做什么？"
    explainer: "“主城巡路”是约 3 分钟的可选序章；“新手旅程”会根据真实职业、探索、装备与副本行为自动推进，两者不是同一个任务。"
    journey-next: "序章已完成；你现在的入门目标是：{step}"
    journey-complete: "序章与八项入门目标都已完成。接下来可自由选择委托、副本、世界事件或构筑养成。"
    states:
      needs-class:
        now: "现在做：先选择一个基础职业。"
        where: "去哪里：点击下方按钮，或找中央广场左前方的紫色职业亭。"
        why: "为什么：职业让巡路按你的战斗方向介绍技能和装备；以后仍可用分支与稀有技能扩展构筑。"
      needs-hub:
        now: "开始前：先安全返回主城的巡路起点。"
        where: "去哪里：点击下方返回主城；抵达出生平台后，再打开 /story status 或与主城导览 · 栖枝交谈。"
        why: "为什么：个人巡路回声只在主城路线活动；远离旧回声时会先安全收回，避免回城后留下不可达演员或跨世界会话。"
      available:
        now: "现在可做：开始主城巡路（约 3 分钟，可选）。"
        where: "去哪里：点击下方开始，跟随只对你可见的巡路回声。"
        why: "为什么：它会带你认清职业、锻造、副本和荒野入口；完成可得 300 金币，用于前期补给或后续养成。"
      active:
        now: "正在进行：跟随巡路回声前往下一站。"
        where: "去哪里：回到回声身边并保持 14 格以内；落后时它会等待。"
        why: "为什么：走完整条路线即可领取一次性 300 金币，但不会替你完成八项成长目标。"
      resumable:
        now: "需要恢复：巡路还没结束，但当前回声已经消失。"
        where: "去哪里：点击“恢复主城巡路”，会从安全起点重新生成回声。"
        why: "为什么：断线或重启后可以接着走，奖励只能领取一次。"
      claimable:
        now: "现在做：巡路已走完，重新领取尚未到账的奖励。"
        where: "去哪里：点击下方“领取巡路奖励”，无需重新走路线。"
        why: "为什么：领取失败可以重试，已经到账的奖励不会重复发放。"
      completed:
        now: "主城巡路已完成，300 金币奖励也已结算。"
        where: "下一步地点会显示在下方，并同步写到热栏旅者罗盘。"
        why: "接下来只看真实入门目标；不再重复巡路，也没有隐藏的第二条经验线。"
    actions:
