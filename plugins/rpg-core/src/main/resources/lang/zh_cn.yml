story:
  echo-name: "栖枝的巡路回声"
  start-needs-hub: "主城巡路只能在回声附近继续，或从起点附近开始。旧回声若仍在已安全收回；正在请求安全返回主城。若战斗或副本规则允许，抵达出生平台后请再次使用 /story start。"
  usage: "使用 /story status|next|start|claim|cancel|help。"
