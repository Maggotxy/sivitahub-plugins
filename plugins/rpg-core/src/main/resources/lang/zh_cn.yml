    handbook-container: "旅者罗盘不能放入外部容器。"
    steps:
      hub:
        name: "认识主城"
        hint: "前往主城并与中央的引路人交谈"
        completion: "打开“引路人 · 阿穹”的真实服务对话后完成；只回城、路过或打开总菜单不算。"
        where: "主城出生平台前方，右键“引路人 · 阿穹”"
        why: "先认清总菜单和玩法入口，之后不再靠猜命令"
        unlock: "旅者罗盘会指向职业选择"
        action: "拜访阿穹并开始交谈"
        action-tooltip: "开启罗盘、距离条和低频路径提示；抵达后右键引路人开始真实对话"
        how:
          - "确认快捷栏第 9 格有“旅者罗盘”；它不会掉落或放入容器。"
          - "点击“导航至引路人”，沿罗盘与路径提示步行抵达，再右键阿穹打开对话。"
          - "阿穹的真实服务对话打开后会自动记录；再选择“打开希维塔总菜单”认识后续入口。"
        rules:
          - "只有实际打开“引路人 · 阿穹”的服务对话才会记录本步骤；仅回城、路过或打开普通菜单不算。"
          - "若不在主城，导航会先按 /hub 的安全规则回城；战斗中或副本内不会强制传送。"
          - "本步骤和功勋奖励只能领取一次；以后仍可回来使用 NPC 服务。"
      class:
        name: "选择职业"
        hint: "在职业菜单中选择初始职业"
        completion: "任一基础职业成功写入角色档案后完成；只浏览职业、抵达职业亭或关闭确认页不算。"
        where: "点击直达职业菜单，或找中央广场左前方的紫色职业亭"
        why: "职业决定武器加成、技能树和第一套战斗循环"
        unlock: "本职业技能与对应装备加成"
        action: "不传送：打开六职业选择"
        action-tooltip: "比较战斗距离、主属性和短板后确定不可随意重选的初始职业"
        how:
          - "先比较六种职业的战斗距离、主属性和短板。"
          - "点击职业图标并确认；基础职业确定后不能随意免费重选。"
          - "职业保存成功后菜单会自动重新打开；接着查看第一个想学技能的五维门槛。"
        rules:
          - "只有职业成功写入角色档案才算完成；浏览图标、关闭确认页或传送到职业亭都不算。"
          - "初始职业决定技能树、武器专精和后续分支，当前没有免费随意重选。"
          - "跨职稀有技能来自装备或特殊内容，不会把基础职业判定改成其它职业。"
      attribute:
        name: "完成首个技能构筑"
        hint: "分配初始 5 点五维，并成功学习 1 个职业技能"
        completion: "角色档案已分配五维且技能树已保存至少 1 个已学技能时完成；两项缺一不可。"
        where: "先在职业与五维菜单加点，再点底部“技能树”学习亮起的技能"
        why: "出城前先形成一个能实际施放的职业循环，不会只带着职业名去打怪"
        unlock: "首个可施放技能、法力与冷却显示"
        action: "不传送：打开职业与五维加点"
        action-tooltip: "连续分完初始 5 点；底部技能树按钮会带你进入同一构筑的学习页"
        how:
          - "按职业分完初始 5 点：奶妈 3 智 2 耐；战士 3 力 2 耐；刺客 4 敏 1 耐；法师 4 智 1 耐；游侠 3 敏 2 力；散人五维各 1。"
          - "职业菜单会原位刷新；分完后点击底部“技能树”，无需关闭菜单猜命令。"
          - "点击青色的首个技能完成学习；只有“已加点且已学 1 技能”才会记录本目标。"
        rules:
          - "六职业首技的五维门槛都恰好需要初始 5 点；点错后不能靠尚未满足门槛的技能完成本步骤。"
          - "系统同时复核角色已有属性与已学习技能；只加点、只看技能说明或尝试施放未学技能都不算。"
          - "每次加点和学习都会写入角色档案并原位刷新；连续点击不需要反复关闭菜单。"
      explore:
        name: "完成原版探索"
        hint: "完成任意非配方原版进度"
        completion: "取得任意真实的原版进度后完成；只解锁配方不算。"
        where: "从出生平台后方的绿色拓荒向导或 /wild 前往荒野"
        why: "原版探索、采集与进度会提供锻造和经济资源"
        unlock: "确认原版生存与 RPG 成长已经接通"
        action: "已在主城：直接前往安全荒野"
        action-tooltip: "前往主世界的安全随机落点"
        how:
          - "出发前带床、食物和基础工具；床既是原版重生点也是唯一家园。"
          - "拜访拓荒向导并选择前往安全荒野；抵达后在床旁使用 /sethome。"
          - "完成任意非配方原版进度，例如挖石头获得“石器时代”、制作石镐获得“获得升级”或睡觉获得“甜美的梦”。"
        rules:
          - "只有亲自达成的原版进度算数；单纯解锁配方不计入目标。"
          - "/wild 会寻找安全落点；战斗中和副本内无法使用，同一玩家只会有一个定位任务。"
          - "家园仍遵循原版床：先在床旁 /sethome，之后只能在主世界使用 /home。"
      hunt:
        name: "击杀动态野怪"
        hint: "击杀 1 只动态等级野怪"
        completion: "亲自击杀 1 只带服务器动态等级标记的敌怪后完成；等级差只影响奖励，不影响本步记录。"
        where: "主世界荒野，寻找头顶带等级的自然敌对怪"
        why: "任意带等级动态怪都可完成；等级差小于 20 才给成长经验和异变材料"
        unlock: "动态怪材料与连猎收益"
        action: "先看适合我的怪物与经验"
        action-tooltip: "读取有效等级，显示合格怪物范围、真实成长经验和荒野入口"
        how:
          - "用怪物指南查看自己的有效等级和推荐怪物范围。"
          - "在主世界荒野寻找头顶带等级的动态敌怪；怪物指南会按当前位置给出下一步，不再把你送回本页。"
          - "击杀任意 1 只带等级动态怪即可完成；只有等级差小于 20 才给成长经验与 RPG 材料。"
        rules:
          - "本目标只认服务器已标记等级的动态怪；普通原版生物、动物和没有等级标记的实体不算。"
          - "等级差达到 20 仍可记录这次动态怪击杀，但不会给成长经验或 RPG 材料，只保留原版掉落。"
          - "连猎只在主世界自然怪生效；换目标、跨世界、间隔过久或远距离移动会按世界规则重置。"
      forge:
        name: "获得自制装备"
        hint: "锻造并持有 1 件自制装备"
        completion: "成功获得一件记录了锻造者的自制装备后完成；只打开界面或锻造失败不算。"
        where: "中央广场右前方的橙色锻造亭，或使用 /forge"
        why: "先用职业礼包完成一次保底首铸，再把原版胚材与掉落组合成长期装备"
        unlock: "装备经验、属性槽揭示与后续精炼"
        action: "不传送：打开真实锻造界面"
        action-tooltip: "首铸把礼包装备胚放第 10 格、8 个首铸核心放第 12 格；预览应显示 0 金币、100%"
        how:
          - "选定职业后会收到 1 件职业首铸装备胚和整组 8 个绑定首铸核心；不需要先寻找原版武器。"
          - "打开锻造界面，把装备胚放第 10 格、8 个核心放第 12 格；首铸预览必须显示 0 金币、100% 成功。"
          - "首铸后续：原版武器/护甲可通过工作台制作、天然宝箱、村民交易、怪物掉落和原版锻造升级取得；核心材料来自适级动态怪、副本 Boss 或 /salvage 分解。"
        rules:
          - "只有成功获得记录了锻造者的自制装备才会完成；打开界面或锻造失败不算。"
          - "首铸补给和首件成品都绑定本人，不能丢弃、放外部容器或市场交易，防止小号刷物资。"
          - "普通后续锻造会重新核对胚材、8 份合格材料、金币和催化剂；成品记录锻造者、槽位与绑定状态。"
      reveal:
        name: "确认首个槽位结果"
        hint: "确认装备槽位：0 槽白板直接完成；有槽装备需揭示第 1 槽"
        completion: "0 槽成品进入背包即完成；总槽位大于 0 时，必须让正在使用的该件装备真实揭示第 1 槽。"
        where: "查看自制装备说明；有槽装备需穿戴或拿在主手继续击败敌人"
        why: "0 槽白板仍可交易；有槽装备必须通过使用经历逐步揭示，避免开出即丢"
        unlock: "有槽装备的第一条可精炼属性，或 0 槽白板的自由流通路线"
        action: "查看适级实战路线"
        action-tooltip: "读取有效等级并打开合格怪物路线；此步骤没有开箱 NPC"
        how:
          - "先查看成品的槽位总数；0 槽白板拿进背包即可完成这一步。"
          - "若有属性槽，把武器拿在主手或穿上护甲，再去主世界或副本击败敌人。"
          - "装备经验达到第 1 槽门槛后属性自动揭示；放在箱子里不会被动成长。"
        rules:
          - "0 槽是合法白板结果，进入背包即确认；总槽位大于 0 时必须至少真实揭示第 1 槽。"
          - "只有主手使用或穿戴中的对应自制装备能从合格战斗获得装备经验；箱内和背包闲置装备不会成长。"
          - "揭示结果写回同一装备；丢弃、换一件未揭槽装备或只打开精炼菜单都不会完成。"
      dungeon:
        name: "完成首次副本通关"
        hint: "完成 1 次有效副本并进入该次通关奖励名单"
        completion: "副本必须成功通关，而且你在该次通关奖励名单中才算完成；进过副本、扣过体力或抢尾刀都不等于通关。"
        where: "出生平台右侧的红色远征亭；先查看等级、体力与队伍条件"
        why: "副本提供高品质材料、隐藏门票与特殊技能书"
        unlock: "自由委托、副本和世界事件路线"
        action: "不传送：查看可进入副本"
        action-tooltip: "查看等级、体力、队伍和门票条件；只有成功通关并进入奖励名单才会完成目标"
        how:
          - "先查看副本列表中的最低等级、个人体力、队伍人数和门票要求。"
          - "选择满足条件的普通副本；组队时每名成员都会独立复核并扣体力。"
          - "完成守卫波次并击败 Boss；成功通关后奖励名单内的队员都会记录，不要求抢尾刀。"
        how-needs-level:
          - "点击绿色按钮打开怪物指南；你当前有效等级 Lv.{level}，首关要求 Lv.{minimum}。"
          - "按推荐范围去主世界荒野击杀动态怪获得成长经验；等级差达到 20 不会给成长经验。"
          - "达到 Lv.{minimum} 后重新右键旅者罗盘；升级期间保持在线也会按节奏恢复体力。"
        how-needs-energy:
          - "点击绿色按钮打开怪物指南，选择原版探索、采集或适级狩猎路线，不要反复撞副本入口。"
          - "保持在线：每 {seconds} 秒恢复 {amount} 体力，当前 {energy}/{cost}；打怪本身不会直接回体力。"
          - "体力达到 {cost} 后重新右键旅者罗盘，绿色按钮会自动切换为可进入副本。"
        rules:
          - "首个普通副本也会在点击进入时逐人复核有效等级、个人体力、在线状态、同世界距离与 1–4 人队伍；任一人失败都不会开始。"
          - "体力只在在线时每 {seconds} 秒恢复 {amount} 点并受耐力上限约束；荒野击杀不会直接回体力，可边做原版内容边等待。"
          - "只有副本成功结束且在奖励名单中的玩家会记录通关；进入大厅、扣过体力、中途退出或只抢 Boss 尾刀都不算。"
