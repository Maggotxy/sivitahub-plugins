# Universal vanilla-client control: single F casts the selected skill and
# double F cycles. Q is deliberately never intercepted because it drops items.
controls:
  # Four ticks keeps a single cast responsive without making a deliberate
  # double-F cycle unrealistically strict for players on ordinary latency.
  double-press-window-millis: 200
