visual-effects:
  enabled: true
  receiver-radius: 40.0
  particles:
    normal: 20
    pressure: 8
    critical: 2
  sound-volume: 0.65
hud:
  enabled: true
  # BetterHud owns the right-side vertical four-slot rail and its class/mana
  # widgets. The center ActionBar remains available for brief feedback. The
  # legacy text HUD is used only when the production pack is unavailable.
  persistent: false
  refresh-seconds: 5
  visible-millis: 5000
  overview-visible-millis: 8000
  update-ticks: 20
  segments: 8
  max-skills: 4
  use-resource-glyphs: true

# 隐藏路线可达性自检（G-106）。
# 路线自身要求的转数与它前置（技能 / 隐藏副本 / 技能书）的开放转数必须在同一条
# 有效等级天梯上兼容，否则路线永久不可达 —— 这是「声明了但拿不到」的整类矛盾。
# fail-on-contradiction: true 表示矛盾直接让 RpgSkills 启动失败（fail-fast），
# 而不是让一条拿不到的路线静默上线。
# G-106 已修：血契路线门抬到三转（HiddenPathRules.minimumAscension=3），与其前置技能
# vanished-horizon 所属刺客三转汇合分支 unseen（stage 3）一致，故置 fail-fast，
# 今后同类矛盾会直接挡住启动。这是本地按人类授权做出的设计裁决，可回滚（见 PR「如需回滚」）。
# 判据为「技能门 + 分支选择门」双读：分支 stage 高于路线门也会被拦住
# （见 HiddenRouteReachability.branchStage，测试 branchSelectionGateIsPartOfTheAudit...）。
hidden-route-reachability:
  enabled: true
  fail-on-contradiction: true

# All repeated skill mechanics share one heartbeat. Damage/healing cadence is
# retained under pressure; only optional visual density is reduced first.
sequence-budget:
  heartbeat-ticks: 2
  # Gameplay sequences never compete with cosmetic trails. This independent
  # hard cap bounds memory while preserving every due damage/heal/control tick
  # during normal and pressure operation.
  maximum-gameplay-active: 256
  profile-at:
    pressure: 32
    critical: 56
  maximum-active:
    normal: 64
    pressure: 36
    critical: 18
  work-per-heartbeat:
    normal: 32
    pressure: 16
    critical: 6

# Skill levels consume the same persistent point budget used to unlock nodes.
# Each ascension opens exactly one additional bounded level; no paid source can
# bypass the current ascension cap. Every concrete skill uses this shared
# cooldown pipeline, so there are no lore-only levels.
skill-leveling:
  maximum-level-by-ascension: [2, 3, 4, 5]
  # Entries are the costs for Lv.1->2, Lv.2->3, Lv.3->4, and Lv.4->5.
  upgrade-point-costs: [2, 4, 6, 8]
  cooldown-reduction-per-level: 0.04
  minimum-cooldown-multiplier: 0.84

skill-effects:
  # Auto-control never targets players in non-PVP worlds or verified party
  # members. In PVP worlds its duration is halved by SkillCrowdControlRules.
  pvp-controls-enabled: true
  healing:
    per-intelligence: 0.01
    maximum-attribute-multiplier: 2.0
  blood-rage:
    # Direct, non-mitigated health cost. A cast must always leave at least 1 health.
    health-cost: 4.0

