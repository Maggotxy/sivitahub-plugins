  # G-106（已修，设计裁决=把血契路线门抬到三转，本技能数值不变）：
  # 血契要求已学本技能（HiddenPathRules.requiredSkill），而本技能是刺客的**三转汇合节点**
  # 技能，证据链：
  #   ① 本值 3 与分支 stage 3 由 RpgSkillsPlugin.validateCatalog() 强制相等（两份配置一致）；
  #   ② plugins/rpg-classes ClassBranchGraph 强制每职业 2/2/1 个 stage 1/2/3 启用分支，
  #      刺客的 stage-3 分支正是 unseen（requires-any [void-walker, plague-scholar] = 两条二转汇合）；
  #   ③ 六职业 menu-slot 31 全为三转汇合技（本技能 slot=31），对称不可单破；
  #   ④ lang/zh_cn.yml 分支说明「unseen: 虚步与毒理在此汇合；无迹绝杀…」把本技能钉在 unseen；
  #   ⑤ docs/CONTENT_DEPTH_AUDIT.md:9/23「三转…允许两条二转路线汇合的终局节点」「起手+进阶+
  #      一转+对应二转+三转汇合」——本技能是三转位；docs/SKILL_MECHANICS_MATRIX.md 列序同。
  # 因此修法是「本值保持 3、血契路线门同步到 3」（HiddenPathRules.minimumAscension(BLOODPACT)=3），
  # 不动 ClassBranchGraph 的 2/2/1。反证「直接把本值降到 2」不可行：validateCatalog 不变式会拒绝
  # 启动（技能门必须 == 分支 stage），而把 unseen 一起降到 2 会让刺客变成 2/3/0，违反 2/2/1。
  vanished-horizon:
    menu-slot: 31
    class: ASSASSIN
    branch: unseen
    minimum-ascension: 3
    minimum-level: 20
    prerequisites: [venom-blade]
    skill-points: 6
    mana-cost: 58
    cooldown-seconds: 46
    requirements: {AGILITY: 32, STAMINA: 18, INTELLIGENCE: 14}

