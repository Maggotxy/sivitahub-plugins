version: 1
description: >-
  Synthetic player decisions for sensitivity analysis, not measured player data.
  Prices, rewards, quotas, fees and drop probabilities come from repository configs.
  A day starts on a Monday; all scenarios use the same deterministic calendar.
default_mix: {newcomer: 20, weekend: 25, core: 30, hardcore: 10, merchant: 7, forger: 5, organizer: 3}
effective_mob_level: 20
market_price_multiple_of_forge_cost: 6.0
market_daily_sale_probability: 0.30
content_gap_maximum_activity_loss: 0.50
calibration_relative_tolerance: 0.20
cohorts:
  # hours; probability of playing; intended actions per active hour/day.
  newcomer: {hours: 1, weekday: 0.75, weekend: 0.90, kills: 24, fishing: 8, mining: 6, dungeons: 0.12, forge: 0.15, refine: 0.1, supply: 0.15, exit: 0.03, list: 0.1, convert: 0.15}
